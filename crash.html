<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Crash X Multiplier - Royal Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* =========================================
     CSS VARIABLES - TEMA KASINO VIP PREMIUM
     ========================================= */
  :root {
    --bg-base: #030507;
    --bg-panel: #0a0e14;
    --bg-glass: rgba(10, 14, 20, 0.8);
    --gold-light: #fef08a;
    --gold-main: #eab308;
    --gold-dark: #a16207;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
    
    --danger: #ef4444;
    --danger-dark: #991b1b;
    --success: #10b981;
    --success-dark: #065f46;
    
    --font-title: 'Cinzel', serif;
    --font-ui: 'Montserrat', sans-serif;
    --font-digital: 'Orbitron', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    background: radial-gradient(circle at 50% 0%, #162032 0%, var(--bg-base) 100%);
    color: var(--text-light);
    font-family: var(--font-ui);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* =========================================
     TOP BAR
     ========================================= */
  .top-bar {
    background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(234, 179, 8, 0.15);
    padding: calc(10px + env(safe-area-inset-top)) 15px 10px;
    display: flex; justify-content: space-between; align-items: center; z-index: 100;
  }
  .btn-back { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s;}
  .btn-back:hover { background: var(--danger); color: white; box-shadow: 0 0 10px rgba(239,68,68,0.5);}
  
  .balance-display { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
  .balance-title { font-size: 9px; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; }
  .balance-amount { font-family: var(--font-digital); font-size: 18px; color: var(--gold-light); text-shadow: 0 0 10px rgba(234, 179, 8, 0.4); font-weight: bold;}

  /* =========================================
     CRASH CHART AREA
     ========================================= */
  .chart-container {
    flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
    background: #000; border-bottom: 2px solid #1e293b; overflow: hidden;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
  }
  
  /* Canvas untuk menggambar grafik */
  #crashCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
  }

  /* Teks Besar Multiplier */
  .multiplier-display {
    position: relative; z-index: 10; text-align: center;
  }
  .multiplier-text {
    font-family: var(--font-digital); font-size: clamp(3rem, 15vw, 6rem);
    font-weight: 900; color: #fff; text-shadow: 0 5px 20px rgba(0,0,0,0.8);
    transition: color 0.2s;
  }
  .multiplier-text.running { color: var(--success); text-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
  .multiplier-text.crashed { color: var(--danger); text-shadow: 0 0 20px rgba(239, 68, 68, 0.6); animation: shake 0.3s; }
  
  .status-text {
    font-family: var(--font-title); font-size: 14px; color: var(--text-muted);
    letter-spacing: 2px; margin-top: 10px; text-transform: uppercase;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-5px); }
  }

  /* =========================================
     CONTROL CONSOLE
     ========================================= */
  .control-console {
    background: var(--bg-panel); padding: 20px 15px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px;
    position: relative; z-index: 20;
  }
  
  /* Bet Adjuster */
  .bet-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bet-btn-ctrl {
    background: #1e293b; border: 1px solid #334155; color: #fff;
    width: 50px; height: 50px; border-radius: 12px; font-size: 24px; font-weight: 300;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
  }
  .bet-btn-ctrl:active { transform: scale(0.9); background: var(--gold-dark); }
  .bet-display-box {
    flex: 1; background: #000; height: 50px; border-radius: 12px; border: 1px solid var(--gold-dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .bet-display-label { font-size: 9px; color: var(--gold-main); letter-spacing: 1px; font-weight: 700;}
  .bet-display-val { font-family: var(--font-digital); font-size: 18px; color: #fff; font-weight: bold;}
  
  /* Preset Chips */
  .chip-selector { display: flex; justify-content: space-between; gap: 8px; }
  .chip-btn {
    flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-digital); font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .chip-btn:active { background: var(--gold-dark); border-color: var(--gold-main); }

  /* Main Action Button */
  .btn-action-main {
    background: linear-gradient(180deg, var(--gold-main), var(--gold-dark)); color: #000; border: none;
    padding: 16px; border-radius: 12px; font-family: var(--font-ui); font-weight: 900; font-size: 18px;
    cursor: pointer; box-shadow: 0 5px 20px rgba(234, 179, 8, 0.4); text-transform: uppercase; letter-spacing: 1px;
    transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .btn-action-main:active { transform: scale(0.98); }
  
  /* State Classes for Button */
  .btn-bet { background: linear-gradient(180deg, var(--gold-main), var(--gold-dark)); color: #000; }
  .btn-cashout { background: linear-gradient(180deg, var(--orange), #c2410c); color: #fff; box-shadow: 0 5px 20px rgba(249, 115, 22, 0.4); animation: pulseBtn 1s infinite alternate;}
  .btn-disabled { background: #1e293b !important; color: #64748b !important; pointer-events: none; box-shadow: none !important;}
  .btn-success { background: linear-gradient(180deg, var(--success), var(--success-dark)); color: white; pointer-events: none; }

  .cashout-profit { font-family: var(--font-digital); font-size: 12px; opacity: 0.9; margin-top: 4px; font-weight: bold;}

  @keyframes pulseBtn {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
    100% { transform: scale(1.02); box-shadow: 0 0 25px rgba(249, 115, 22, 0.8); }
  }

  /* Confetti Overlay */
  canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>

  <canvas id="confettiCanvas" class="confetti"></canvas>

  <!-- TOP BAR -->
  <header class="top-bar">
    <button class="btn-back" id="btnExit" onclick="saveAndExit()">⬅ LOBBY</button>
    <div class="balance-display">
      <div class="balance-title">CREDITS</div>
      <div class="balance-amount" id="displayBalance">0</div>
    </div>
  </header>

  <!-- CRASH CHART -->
  <main class="chart-container">
    <canvas id="crashCanvas"></canvas>
    <div class="multiplier-display">
      <div class="multiplier-text" id="multText">1.00x</div>
      <div class="status-text" id="statusText">WAITING FOR NEXT ROUND</div>
    </div>
  </main>

  <!-- CONTROL CONSOLE -->
  <footer class="control-console">
    <!-- Preset Chips -->
    <div class="chip-selector">
      <button class="chip-btn" onclick="setBetAmount(100)">100</button>
      <button class="chip-btn" onclick="setBetAmount(1000)">1K</button>
      <button class="chip-btn" onclick="setBetAmount(5000)">5K</button>
      <button class="chip-btn" onclick="setBetAmount(10000)">10K</button>
      <button class="chip-btn" onclick="setBetAmount(50000)">50K</button>
    </div>

    <!-- Bet Adjuster -->
    <div class="bet-row">
      <button class="bet-btn-ctrl" onclick="adjustBet(0.5)">½</button>
      <div class="bet-display-box">
        <span class="bet-display-label">CURRENT BET</span>
        <span class="bet-display-val" id="betDisplay">1,000</span>
      </div>
      <button class="bet-btn-ctrl" onclick="adjustBet(2)">x2</button>
    </div>

    <!-- Main Action Button -->
    <button class="btn-action-main btn-bet" id="mainBtn" onclick="handleAction()">
      PLACE BET
    </button>
  </footer>

<script src="api.js"></script>
<script>
/**
 * ==============================================================
 * 1. AUTH & SETUP
 * ==============================================================
 */
const userJson = localStorage.getItem('currentUser');
if (!userJson) window.location.href = 'auth.html';
let currentUser = JSON.parse(userJson);
let playerWinRate = 0.15; 

// Tarik data RTP JSON Bin
if (typeof api !== 'undefined' && api.getDatabase) {
  api.getDatabase().then(db => {
    if (db && db.users) {
      const freshUser = db.users.find(u => u.username === currentUser.username);
      if (freshUser) {
        if (freshUser.winRate !== undefined) playerWinRate = parseFloat(freshUser.winRate) / 100;
        currentUser.balance = freshUser.balance;
        updateBalanceUI();
      }
    }
  }).catch(e => console.error(e));
}

function updateBalanceUI() {
  document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
}
updateBalanceUI();

async function saveAndExit() {
  document.getElementById('btnExit').textContent = "SAVING...";
  try {
    if (typeof api !== 'undefined' && api.saveProgress) {
      await api.saveProgress(currentUser.username, currentUser.balance, currentUser.level || 1, currentUser.exp || 0);
    }
  } catch(e) {} finally { window.location.href = 'index.html'; }
}

/**
 * ==============================================================
 * 2. GAME STATE & BETTING LOGIC
 * ==============================================================
 */
let currentBet = 1000;
let gameState = 'IDLE'; // IDLE, BET_PLACED, PLAYING, CASHED_OUT, CRASHED
let currentMultiplier = 1.00;
let crashPoint = 1.00;

function setBetAmount(amount) {
  if (gameState !== 'IDLE') return;
  currentBet = amount;
  document.getElementById('betDisplay').textContent = currentBet.toLocaleString();
}

function adjustBet(factor) {
  if (gameState !== 'IDLE') return;
  currentBet = Math.floor(currentBet * factor);
  if(currentBet < 100) currentBet = 100;
  document.getElementById('betDisplay').textContent = currentBet.toLocaleString();
}

function handleAction() {
  const btn = document.getElementById('mainBtn');
  
  if (gameState === 'IDLE') {
    if (currentBet > currentUser.balance) return alert("Saldo tidak mencukupi!");
    
    currentUser.balance -= currentBet;
    updateBalanceUI();
    
    gameState = 'BET_PLACED';
    btn.className = 'btn-action-main btn-disabled';
    btn.innerHTML = 'WAITING TO START...';
    
    // Mulai game setelah 1.5 detik
    setTimeout(() => {
      if(gameState === 'BET_PLACED') startRound();
    }, 1500);

  } else if (gameState === 'PLAYING') {
    // CASH OUT!
    cashOut();
  }
}

/**
 * ==============================================================
 * 3. RTP ENGINE (ANTI-FARMING CRASH POINT)
 * ==============================================================
 */
function calculateCrashPoint() {
  let isWinRound = Math.random() < playerWinRate;
  
  if (isWinRound) {
    // MENANG: Multiplier bagus (2x sampai 15x, atau kadang sangat tinggi)
    let r = Math.random();
    if (r < 0.7) return 2.00 + (Math.random() * 3.00); // 2x - 5x
    else if (r < 0.95) return 5.00 + (Math.random() * 5.00); // 5x - 10x
    else return 10.00 + (Math.random() * 20.00); // 10x - 30x (Jackpot chance)
  } else {
    // KALAH/ZONK: Anti-Farming System
    // Jika giliran zonk, pemain DILARANG KERAS farming dengan cashout cepat.
    let r = Math.random();
    if (r < 0.40) {
      return 1.00; // 40% kemungkinan Instan Crash (Pemain pasti rugi)
    } else if (r < 0.85) {
      return 1.01 + (Math.random() * 0.19); // 1.01x - 1.20x (Sangat pelit)
    } else {
      return 1.21 + (Math.random() * 0.50); // 1.21x - 1.71x (Sesekali naik dikit agar realistik)
    }
  }
}

/**
 * ==============================================================
 * 4. GAME LOOP & CANVAS ANIMATION
 * ==============================================================
 */
const canvas = document.getElementById('crashCanvas');
const ctx = canvas.getContext('2d');
let animFrame;
let startTime = 0;

function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawGraph(elapsedMs) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Hitung persentase progress visual (sumbu X dan Y)
  // Grafik sumbu X akan penuh jika mencapai 10 detik
  let progressX = Math.min(elapsedMs / 10000, 1) * canvas.width;
  
  // Sumbu Y berdasarkan multiplier (visual maksimal limit misal 10x)
  let yMax = 10;
  let progressY = canvas.height - Math.min((currentMultiplier - 1) / yMax, 1) * (canvas.height * 0.8); 
  
  // Posisikan garis dari bawah kiri
  ctx.beginPath();
  ctx.moveTo(0, canvas.height);
  
  // Tarik kurva halus mengikuti waktu
  ctx.quadraticCurveTo(progressX * 0.5, canvas.height, progressX, progressY);
  
  // Warna Grafik
  if (gameState === 'CRASHED') ctx.strokeStyle = '#ef4444'; // Red
  else if (gameState === 'CASHED_OUT') ctx.strokeStyle = '#94a3b8'; // Gray (user safety)
  else ctx.strokeStyle = '#10b981'; // Green
  
  ctx.lineWidth = 4;
  ctx.stroke();

  // Efek Gradien dibawah grafik
  ctx.lineTo(progressX, canvas.height);
  ctx.lineTo(0, canvas.height);
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  
  if (gameState === 'CRASHED') {
    grad.addColorStop(0, 'rgba(239, 68, 68, 0.4)');
    grad.addColorStop(1, 'rgba(239, 68, 68, 0.0)');
  } else {
    grad.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
    grad.addColorStop(1, 'rgba(16, 185, 129, 0.0)');
  }
  
  ctx.fillStyle = grad;
  ctx.fill();

  // Gambar Dot Roket di ujung grafik
  ctx.beginPath();
  ctx.arc(progressX, progressY, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 15;
}

function startRound() {
  gameState = 'PLAYING';
  crashPoint = calculateCrashPoint();
  currentMultiplier = 1.00;
  startTime = performance.now();
  
  const multText = document.getElementById('multText');
  const statText = document.getElementById('statusText');
  const btn = document.getElementById('mainBtn');
  
  multText.className = 'multiplier-text running';
  statText.textContent = 'FLYING...';
  
  btn.className = 'btn-action-main btn-cashout';
  btn.innerHTML = `CASH OUT<div class="cashout-profit">Win: ${currentBet.toLocaleString()}</div>`;

  // Start Animation Loop
  function tick(now) {
    let elapsed = now - startTime;
    
    // Formula Kuadratik Eksponensial: Naik pelan lalu semakin cepat
    currentMultiplier = 1.00 + Math.pow(elapsed / 1000, 2) * 0.05;
    
    // Jika mencapai batas hancur
    if (currentMultiplier >= crashPoint) {
      currentMultiplier = crashPoint;
      crashRound();
      drawGraph(elapsed); // Gambar final
      return;
    }

    // Update UI Teks
    multText.textContent = currentMultiplier.toFixed(2) + 'x';
    
    // Update Button Profit Text dynamically
    if (gameState === 'PLAYING') {
      let currentProfit = Math.floor(currentBet * currentMultiplier);
      btn.innerHTML = `CASH OUT<div class="cashout-profit">Win: ${currentProfit.toLocaleString()}</div>`;
    }

    drawGraph(elapsed);
    animFrame = requestAnimationFrame(tick);
  }
  
  animFrame = requestAnimationFrame(tick);
}

function cashOut() {
  if (gameState !== 'PLAYING') return;
  gameState = 'CASHED_OUT';
  
  let winAmount = Math.floor(currentBet * currentMultiplier);
  currentUser.balance += winAmount;
  updateBalanceUI();
  
  const btn = document.getElementById('mainBtn');
  btn.className = 'btn-action-main btn-success';
  btn.innerHTML = `SUCCESS<div class="cashout-profit">+${winAmount.toLocaleString()}</div>`;
  
  document.getElementById('statusText').textContent = 'CASHED OUT! WAITING FOR CRASH...';
  confettiEngine.burst(50);
}

function crashRound() {
  if (gameState === 'PLAYING') {
    // Pemain telat cashout (ZONK)
    gameState = 'CRASHED';
    const btn = document.getElementById('mainBtn');
    btn.className = 'btn-action-main btn-disabled';
    btn.innerHTML = 'BET LOST';
  } else if (gameState === 'CASHED_OUT') {
    // Status grafik hancur, tapi player sudah aman
    gameState = 'CRASHED';
  }
  
  const multText = document.getElementById('multText');
  multText.className = 'multiplier-text crashed';
  multText.textContent = crashPoint.toFixed(2) + 'x';
  document.getElementById('statusText').textContent = 'CRASHED!';
  
  // Auto Save
  if(typeof api !== 'undefined' && api.saveProgress) {
    api.saveProgress(currentUser.username, currentUser.balance, currentUser.level||1, currentUser.exp||0).catch(()=>{});
  }

  // Reset setelah 3 detik
  setTimeout(() => {
    resetBoard();
  }, 3000);
}

function resetBoard() {
  gameState = 'IDLE';
  currentMultiplier = 1.00;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const multText = document.getElementById('multText');
  multText.className = 'multiplier-text';
  multText.textContent = '1.00x';
  document.getElementById('statusText').textContent = 'WAITING FOR NEXT ROUND';
  
  const btn = document.getElementById('mainBtn');
  btn.className = 'btn-action-main btn-bet';
  btn.innerHTML = 'PLACE BET';
}

/**
 * ==============================================================
 * 5. CONFETTI ENGINE (Sama dengan sebelumnya)
 * ==============================================================
 */
const confettiEngine = {
  canvas: document.getElementById('confettiCanvas'), ctx: null, particles: [], isActive: false,
  colors: ['#10b981', '#34d399', '#fef08a', '#ffffff'],
  init() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); this.run(); },
  resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  spawn(count) {
    for(let i=0; i<count; i++) {
      this.particles.push({
        x: this.canvas.width/2, y: this.canvas.height/2, vx: (Math.random()-0.5)*35, vy: (Math.random()-1)*35,
        size: Math.random()*12+6, color: this.colors[Math.floor(Math.random()*this.colors.length)],
        rot: Math.random()*360, rotSpd: (Math.random()-0.5)*20, life: 1
      });
    }
  },
  burst(count) { this.spawn(count); },
  run() {
    if(this.particles.length > 0) {
      this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height);
      this.particles.forEach((p, i) => {
        p.vy += 0.8; p.x += p.vx; p.y += p.vy; p.rot += p.rotSpd; p.life -= 0.015;
        this.ctx.save(); this.ctx.translate(p.x, p.y); this.ctx.rotate(p.rot*Math.PI/180);
        this.ctx.fillStyle = p.color; this.ctx.globalAlpha = Math.max(p.life, 0);
        this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); this.ctx.restore();
        if(p.y > this.canvas.height || p.life <= 0) this.particles.splice(i, 1);
      });
    } else { this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height); }
    requestAnimationFrame(() => this.run());
  }
};
confettiEngine.init();

</script>
</body>
</html>
