<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Casino - Autentikasi</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Variabel Tema Kasino */
  :root {
    --bg-base: #06090e;
    --bg-panel: #11151e;
    --gold-light: #ffdf73;
    --gold-main: #d4af37;
    --gold-dark: #8a6d1c;
    --text-light: #e2e8f0;
    --text-muted: #64748b;
    --danger: #ef4444;
    --success: #22c55e;
    --font-title: 'Cinzel', serif;
    --font-ui: 'Montserrat', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--bg-base) 100%);
    color: var(--text-light);
    font-family: var(--font-ui);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .auth-container {
    background: var(--bg-panel);
    width: 100%;
    max-width: 400px;
    border-radius: 16px;
    border: 1px solid var(--gold-dark);
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
  }

  .auth-header {
    text-align: center;
    padding: 30px 20px 20px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  }

  .auth-logo {
    font-family: var(--font-title);
    font-size: 28px;
    color: var(--gold-main);
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    margin-bottom: 10px;
  }

  .auth-tabs {
    display: flex;
    background: #0f172a;
  }

  .tab-btn {
    flex: 1;
    padding: 15px 0;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    font-size: 14px;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active {
    color: var(--gold-light);
    border-bottom: 2px solid var(--gold-main);
    background: rgba(212, 175, 55, 0.05);
  }

  .auth-body {
    padding: 30px 20px;
  }

  .auth-form {
    display: none;
    flex-direction: column;
    gap: 15px;
  }

  .auth-form.active {
    display: flex;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .input-group label {
    font-size: 12px;
    color: var(--gold-main);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .input-group input {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 12px 15px;
    border-radius: 8px;
    color: white;
    font-family: var(--font-ui);
    outline: none;
    transition: 0.3s;
  }

  .input-group input:focus {
    border-color: var(--gold-main);
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
  }

  .btn-submit {
    background: linear-gradient(180deg, var(--gold-main), var(--gold-dark));
    color: #000;
    border: none;
    padding: 15px;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
    text-transform: uppercase;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
  }

  .btn-submit:disabled {
    background: #334155;
    color: #94a3b8;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .alert {
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    display: none;
    font-weight: 600;
  }

  .alert.error { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); display: block; }
  .alert.success { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); display: block; }

</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-header">
    <div class="auth-logo">ROYAL CASINO</div>
    <p style="font-size: 12px; color: var(--text-muted);">Platform Hiburan Eksklusif</p>
  </div>

  <div class="auth-tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Masuk</button>
    <button class="tab-btn" onclick="switchTab('register')">Daftar</button>
  </div>

  <div class="auth-body">
    <!-- FORM LOGIN -->
    <form id="loginForm" class="auth-form active">
      <div id="loginAlert" class="alert"></div>
      
      <div class="input-group">
        <label>USERNAME</label>
        <input type="text" id="loginUsername" required placeholder="Masukkan username">
      </div>
      <div class="input-group">
        <label>PASSWORD</label>
        <input type="password" id="loginPassword" required placeholder="Masukkan password">
      </div>
      
      <button type="submit" class="btn-submit" id="btnLogin">MASUK SEKARANG</button>
    </form>

    <!-- FORM REGISTER -->
    <form id="registerForm" class="auth-form">
      <div id="registerAlert" class="alert"></div>

      <div class="input-group">
        <label>NAMA LENGKAP</label>
        <input type="text" id="regFullName" required placeholder="Nama sesuai identitas">
      </div>
      <div class="input-group">
        <label>USERNAME</label>
        <input type="text" id="regUsername" required placeholder="Pilih username unik">
      </div>
      <div class="input-group">
        <label>EMAIL</label>
        <input type="email" id="regEmail" required placeholder="Email aktif">
      </div>
      <div class="input-group">
        <label>NOMOR HP</label>
        <input type="tel" id="regPhone" required placeholder="08xxxxxxxxxx">
      </div>
      <div class="input-group">
        <label>REKENING / E-WALLET</label>
        <input type="text" id="regBank" required placeholder="BCA 1234xxx / GoPay 08xx">
      </div>
      <div class="input-group">
        <label>PASSWORD</label>
        <input type="password" id="regPassword" required placeholder="Minimal 6 karakter">
      </div>
      
      <button type="submit" class="btn-submit" id="btnRegister">DAFTAR AKUN</button>
    </form>
  </div>
</div>

<!-- Import file api.js dari Tahap 1 -->
<script src="api.js"></script>
<script>
  // Cek jika user sudah login, langsung arahkan ke Lobby (index.html)
  if(localStorage.getItem('currentUser')) {
    window.location.href = 'index.html'; // Akan kita buat di Tahap 3
  }

  // Fungsi untuk mengganti tampilan Login / Register
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
    
    if (tab === 'login') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('registerForm').classList.add('active');
    }
  }

  // Fungsi utilitas untuk menampilkan pesan peringatan
  function showAlert(elementId, message, type) {
    const el = document.getElementById(elementId);
    el.textContent = message;
    el.className = `alert ${type}`; // type = 'error' atau 'success'
  }

  // EVENT LISTENER: PROSES LOGIN
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = "MEMPROSES...";
    
    const user = document.getElementById('loginUsername').value;
    const pass = document.getElementById('loginPassword').value;

    // Memanggil fungsi login dari api.js
    const result = await api.login(user, pass);

    if (result.success) {
      showAlert('loginAlert', 'Login Berhasil! Mengalihkan...', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1000); // Arahkan ke Lobby
    } else {
      showAlert('loginAlert', result.message, 'error');
      btn.disabled = false;
      btn.textContent = "MASUK SEKARANG";
    }
  });

  // EVENT LISTENER: PROSES REGISTER
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnRegister');
    
    // Validasi sederhana
    const password = document.getElementById('regPassword').value;
    if(password.length < 6) {
      return showAlert('registerAlert', 'Password minimal 6 karakter!', 'error');
    }

    btn.disabled = true;
    btn.textContent = "MENDAFTARKAN...";

    const newUserObj = {
      fullName: document.getElementById('regFullName').value,
      username: document.getElementById('regUsername').value,
      email: document.getElementById('regEmail').value,
      phone: document.getElementById('regPhone').value,
      bank: document.getElementById('regBank').value,
      password: password
    };

    // Memanggil fungsi register dari api.js
    const result = await api.register(newUserObj);

    if (result.success) {
      showAlert('registerAlert', 'Pendaftaran sukses! Silakan login.', 'success');
      // Bersihkan form
      document.getElementById('registerForm').reset();
      // Pindah ke tab login
      setTimeout(() => {
        switchTab('login');
        document.getElementById('loginUsername').value = newUserObj.username;
      }, 1500);
    } else {
      showAlert('registerAlert', result.message, 'error');
    }
    
    btn.disabled = false;
    btn.textContent = "DAFTAR AKUN";
  });
</script>
</body>
</html>
