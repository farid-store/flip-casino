<style>
  /* =========================================
     CSS VARIABLES - TEMA KASINO VIP PREMIUM
     ========================================= */
  :root {
    --bg-base: #0a0a0c;
    --bg-panel: #121418;
    --bg-glass: rgba(18, 20, 24, 0.85);
    --gold-light: #fef08a;
    --gold-main: #eab308;
    --gold-dark: #a16207;
    --gold-glow: rgba(234, 179, 8, 0.4);
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
    
    --danger: #e11d48;
    --danger-dark: #9f1239;
    --success: #10b981;
    --success-dark: #047857;
    
    --font-title: 'Cinzel', serif;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    background: radial-gradient(circle at 50% 0%, #1e2532 0%, var(--bg-base) 100%);
    color: var(--text-light);
    font-family: var(--font-ui);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;

     TOP BAR
     ========================================= */
  .top-bar {
    background: var(--bg-glass); 
    backdrop-filter: blur(16px);

    border-bottom: 1px solid rgba(234, 179, 8, 0.2);
    padding: calc(10px + env(safe-area-inset-top)) 20px 10px;

  /* =========================================

  /* KIRI: ROULETTE WHEEL */
  .left-pane {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: #000; border-bottom: 2px solid var(--gold-dark); position: relative;
    padding: 20px 0;
  }
  
  .live-indicator {
    position: absolute; top: 15px; left: 20px;
    font-family: var(--font-digital); font-size: 11px; color: var(--danger); font-weight: bold; letter-spacing: 2px;
    display: flex; align-items: center; gap: 6px; z-index: 50; text-shadow: 0 0 10px rgba(225, 29, 72, 0.8);
  }
  .live-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: blink 1s infinite alternate; box-shadow: 0 0 8px var(--danger);}

  .wheel-wrapper {
    position: relative; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .wheel-wrapper::before, .wheel-wrapper::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 60px; z-index: 15; pointer-events: none;
  }
  .wheel-wrapper::before { left: 0; background: linear-gradient(90deg, #000 0%, transparent 100%); }
  .wheel-wrapper::after { right: 0; background: linear-gradient(-90deg, #000 0%, transparent 100%); }

  .wheel-container {
    width: 100%; padding: 20px 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9); height: 110px;
  }
  .wheel-selector {
    position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 4px; background: #fff; z-index: 20; 
    box-shadow: 0 0 15px var(--gold-light), 0 0 30px var(--gold-main); border-radius: 2px;
  }
  .wheel-selector::before, .wheel-selector::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%); border-left: 12px solid transparent; border-right: 12px solid transparent;
  }
  .wheel-selector::before { top: -2px; border-top: 16px solid var(--gold-light); }
  .wheel-selector::after { bottom: -2px; border-bottom: 16px solid var(--gold-light); }

  .wheel-track { display: flex; gap: 4px; transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1); will-change: transform; }
  .wheel-number {
    min-width: 55px; height: 70px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-title); font-size: 26px; font-weight: 800; color: white;
    box-shadow: inset 0 2px 10px rgba(255,255,255,0.2), inset 0 -4px 10px rgba(0,0,0,0.6);

  .bg-red { background: linear-gradient(145deg, var(--danger), var(--danger-dark)); }
  .bg-black { background: linear-gradient(145deg, #334155, #0f172a); }
  .bg-green { background: linear-gradient(145deg, var(--success), var(--success-dark)); }

  /* KANAN: BOARD & CONTROL */
  .right-pane { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: radial-gradient(circle at center, rgba(30, 41, 59, 0.4) 0%, transparent 100%); }
  
  .board-container {
    flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; align-items: center;

  .board-container::-webkit-scrollbar { width: 6px; }
  .board-container::-webkit-scrollbar-thumb { background: rgba(234, 179, 8, 0.5); border-radius: 10px; }

  .table-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 420px; width: 100%; }
  
  .bet-spot {
    background: #0f172a; border: 2px solid #1e293b; border-radius: 8px; height: 50px;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 18px; font-weight: 800;

  .bet-spot:active { transform: scale(0.92); box-shadow: 0 0 15px var(--gold-glow); border-color: var(--gold-main); z-index: 10;}

  .spot-outside { background: #1e293b; color: var(--gold-light); font-family: var(--font-ui); font-size: 13px; font-weight: 700; border-color: var(--gold-dark); letter-spacing: 1px;}
  .outside-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-width: 420px; width: 100%; margin-top: 6px; }

  /* Animated Chip */
  .chip-placed {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--gold-light) 0%, var(--gold-main) 60%, var(--gold-dark) 100%);
    color: #000; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-digital); font-size: 10px; font-weight: 900; border: 3px dashed #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 0 4px rgba(0,0,0,0.5); 
    z-index: 5; pointer-events: none; animation: chipDrop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes chipDrop { 0% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .chip-update { animation: chipPulse 0.3s ease forwards !important; }
  @keyframes chipPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } }

  /* CONTROL CONSOLE */
  .control-console {
    background: var(--bg-panel); border-top: 1px solid rgba(255,255,255,0.05); padding: 15px 20px calc(15px + env(safe-area-inset-bottom));
    box-shadow: 0 -15px 40px rgba(0,0,0,0.7); position: relative; z-index: 100;
  }
  
  .chip-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; max-width: 500px; margin-left: auto; margin-right: auto;}
  .chip-btn {
    flex: 1; aspect-ratio: 1/1; max-width: 65px; border-radius: 50%; border: 3px dashed #475569; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); 
    color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-digital); font-size: 13px; font-weight: bold; cursor: pointer; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px rgba(0,0,0,0.4);
  }
  .chip-btn.active { 
    border-color: #fff; background: radial-gradient(circle, var(--gold-light) 0%, var(--gold-main) 70%, var(--gold-dark) 100%); 
    color: #000; transform: translateY(-8px) scale(1.1); box-shadow: 0 10px 20px var(--gold-glow);
  }

  .actions-row { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; max-width: 500px; margin: 0 auto; }
  .btn-clear { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: var(--text-light); border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s;}
  .btn-clear:active { background: rgba(255,255,255,0.15); transform: scale(0.95); }
  
  .btn-spin {
    background: linear-gradient(180deg, var(--gold-light), var(--gold-main)); color: #000; border: none; padding: 16px; border-radius: 12px; font-family: var(--font-ui); font-weight: 900; font-size: 16px;
    cursor: pointer; box-shadow: 0 6px 20px var(--gold-glow); text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .btn-spin::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); animation: shine 3s infinite; }
  @keyframes shine { 100% { left: 200%; } }
  .btn-spin:active { transform: scale(0.95); box-shadow: 0 2px 10px var(--gold-glow); }
  .btn-spin:disabled { background: #334155; color: #94a3b8; box-shadow: none; pointer-events: none; }
  .btn-spin:disabled::after { display: none; }

  .info-banner { 
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 8px; text-align: center; border-radius: 8px; margin-bottom: 15px; 
    font-family: var(--font-digital); font-size: 13px; color: var(--gold-light); letter-spacing: 2px; max-width: 500px; margin-left: auto; margin-right: auto; transition: 0.3s;

  @keyframes pulse { from { box-shadow: 0 0 5px rgba(16, 185, 129, 0.2); } to { box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); } }

  /* OVERLAYS (JACKPOT / ZONK) */
  .overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 5000; 
    opacity: 0; pointer-events: none; transition: all 0.4s ease; flex-direction: column; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content { text-align: center; transform: scale(0.8); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .overlay.show .modal-content { transform: scale(1); opacity: 1; }
  
  .result-label { font-size: 16px; color: var(--text-muted); font-weight: 700; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase;}
  .result-num { font-family: var(--font-title); font-size: 120px; color: white; line-height: 1; margin-bottom: 15px; text-shadow: 0 10px 40px rgba(0,0,0,0.9);}
  .result-payout { font-family: var(--font-digital); font-size: 32px; color: var(--gold-light); font-weight: 900; text-shadow: 0 0 20px var(--gold-glow);}
  .result-zonk { font-family: var(--font-digital); font-size: 32px; color: var(--danger); font-weight: 900; text-shadow: 0 0 20px rgba(225, 29, 72, 0.5);}
  .tap-continue { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 30px; letter-spacing: 2px; animation: blink 1.5s infinite alternate;}
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.3; } }
  
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

  /* =========================================
     RESPONSIVE DESKTOP TWEAKS (Kunci 2 Kolom)
     ========================================= */
  @media (min-width: 1024px) {
    .game-layout { flex-direction: row; }
    
    .left-pane {
      width: 45%; border-bottom: none; border-right: 2px solid var(--gold-dark);
      padding: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.8); z-index: 10;
    }
    .wheel-container { height: 160px; }
    .wheel-number { min-width: 70px; height: 90px; font-size: 34px; }
    .live-indicator { top: 30px; left: 30px; font-size: 14px; }
    
    .right-pane { width: 55%; justify-content: space-between; }
    .board-container { justify-content: center; } /* Vertically centers the board on large screens */
    .table-grid, .outside-grid { max-width: 500px; gap: 8px;}
    .bet-spot { height: 60px; font-size: 20px; }
    .spot-green { height: 70px; font-size: 26px; }
    
    .control-console { border-radius: 0; padding-top: 25px; padding-bottom: 25px;}
  }

</style>

<script src="api.js"></script>
<script>
/**
 * ==============================================================
 * 1. AUTH & SETUP
 * ==============================================================
 */
const userJson = localStorage.getItem('currentUser');
if (!userJson) window.location.href = 'auth.html';
let currentUser = JSON.parse(userJson) || { username: 'Guest', balance: 50000 };
let playerWinRate = 0.15;

if (typeof api !== 'undefined' && api.getDatabase) {
  api.getDatabase().then(db => {
    if (db && db.users) {
      const freshUser = db.users.find(u => u.username === currentUser.username);
      if (freshUser) {
        if (freshUser.winRate !== undefined) playerWinRate = parseFloat(freshUser.winRate) / 100;
        currentUser.balance = freshUser.balance;
        document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
      }
    }
  }).catch(e => console.error(e));
}
document.getElementById('displayBalance').textContent = (currentUser.balance || 0).toLocaleString();

async function saveAndExit() {
  document.getElementById('btnExit').textContent = "SAVING...";
  try {
    if (typeof api !== 'undefined' && api.saveProgress) {
      await api.saveProgress(currentUser.username, currentUser.balance, currentUser.level || 1, currentUser.exp || 0);
    }
  } catch(e) {} finally { window.location.href = 'index.html'; }
}

/**
 * ==============================================================
 * 2. BOARD & ROULETTE GENERATION
 * ==============================================================
 */
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const ROULETTE_SEQ = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

let currentChip = 100;
let bets = {}; 
let totalBet = 0;
let isSpinning = false;

const board = document.getElementById('bettingBoard');
for(let i=1; i<=36; i++) {
  let isRed = RED_NUMS.includes(i);
  let colorClass = isRed ? 'spot-red' : 'spot-black';
  let spot = document.createElement('div');
  spot.className = `bet-spot ${colorClass}`;
  spot.innerHTML = `${i}<div class="chip-placed" style="display:none;" id="chip-${i}">0</div>`;
  spot.onclick = () => placeBet(i.toString());
  board.appendChild(spot);
}

const track = document.getElementById('wheelTrack');
function buildTrack() {
  track.innerHTML = '';
  for(let loop=0; loop<5; loop++) {
    ROULETTE_SEQ.forEach(num => {
      let colorClass = num === 0 ? 'bg-green' : (RED_NUMS.includes(num) ? 'bg-red' : 'bg-black');
      let item = document.createElement('div');
      item.className = `wheel-number ${colorClass}`;
      item.textContent = num;
      track.appendChild(item);
    });
  }
}
buildTrack();

/**
 * ==============================================================
 * 3. BETTING SYSTEM
 * ==============================================================
 */
function selectChip(val) {
  if (isSpinning) return;
  currentChip = val;
  document.querySelectorAll('.chip-btn').forEach(btn => {
    btn.classList.remove('active');
    let btnVal = btn.textContent;
    btnVal = btnVal.includes('K') ? parseInt(btnVal.replace('K','')) * 1000 : parseInt(btnVal);
    if(btnVal === val) btn.classList.add('active');
  });
}

function formatChip(val) { return val >= 1000 ? (val/1000) + 'K' : val; }

function placeBet(spotId) {
  if (isSpinning) return;
  if (currentUser.balance < currentChip) return setBanner("INSUFFICIENT BALANCE!");

  currentUser.balance -= currentChip;
  totalBet += currentChip;
  if (!bets[spotId]) bets[spotId] = 0;
  bets[spotId] += currentChip;
  
  document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
  document.getElementById('spinTotal').textContent = `(${formatChip(totalBet)})`;
  
  const chipUI = document.getElementById(`chip-${spotId}`);
  chipUI.style.display = 'flex';
  chipUI.textContent = formatChip(bets[spotId]);
  chipUI.classList.remove('chip-update');
  void chipUI.offsetWidth; 
  chipUI.classList.add('chip-update');
  
  setBanner("BET PLACED");
}

function clearBets() {
  if (isSpinning || totalBet === 0) return;
  currentUser.balance += totalBet; totalBet = 0; bets = {};
  
  document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
  document.getElementById('spinTotal').textContent = '';
  document.querySelectorAll('.chip-placed').forEach(el => { el.style.display = 'none'; el.classList.remove('chip-update'); });
  setBanner("BETS CLEARED");
}

function setBanner(msg, isWin=false) {
  const banner = document.getElementById('infoBanner');
  banner.textContent = msg;
  if(isWin) banner.classList.add('win-text'); else banner.classList.remove('win-text');
}

/**
 * ==============================================================
 * 4. RTP & RIGGING ENGINE
 * ==============================================================
 */
function calculatePayoutForNumber(num) {
  let payout = 0;
  if (bets[num.toString()]) payout += bets[num.toString()] * 36;
  if (num !== 0) {
    let isRed = RED_NUMS.includes(num); let isEven = num % 2 === 0;
    if (isRed && bets['RED']) payout += bets['RED'] * 2;
    if (!isRed && bets['BLACK']) payout += bets['BLACK'] * 2;
    if (isEven && bets['EVEN']) payout += bets['EVEN'] * 2;
    if (!isEven && bets['ODD']) payout += bets['ODD'] * 2;
  }
  return payout;
}

function determineWinningNumber() {
  if (Object.keys(bets).length === 0) return ROULETTE_SEQ[Math.floor(Math.random() * ROULETTE_SEQ.length)];
  let forceWin = (Math.random() < playerWinRate);
  let possibleOutcomes = [];

  for(let i=0; i<=36; i++) {
    possibleOutcomes.push({ num: i, net: calculatePayoutForNumber(i) - totalBet, payout: calculatePayoutForNumber(i) });
  }

  if (forceWin) {
    let winPool = possibleOutcomes.filter(o => o.net > 0);
    return winPool.length > 0 ? winPool[Math.floor(Math.random() * winPool.length)].num : ROULETTE_SEQ[Math.floor(Math.random() * ROULETTE_SEQ.length)];
  } else {
    let losePool = possibleOutcomes.filter(o => o.net <= 0);
    if (losePool.length > 0) {
      let strictZonk = losePool.filter(o => o.net < 0);
      if(strictZonk.length > 0 && Math.random() > 0.2) return strictZonk[Math.floor(Math.random() * strictZonk.length)].num;
      return losePool[Math.floor(Math.random() * losePool.length)].num;
    }
    possibleOutcomes.sort((a,b) => a.payout - b.payout); return possibleOutcomes[0].num; 
  }
}

/**
 * ==============================================================
 * 5. DYNAMIC SPIN ANIMATION (ANTI TERPOTONG DI DESKTOP)
 * ==============================================================
 */
function spinWheel() {
  if (isSpinning) return;
  if (totalBet === 0) return setBanner("PLACE A BET FIRST!");

  isSpinning = true;
  document.getElementById('btnSpin').disabled = true;
  document.getElementById('btnClear').disabled = true;
  setBanner("NO MORE BETS!");

  let targetNum = determineWinningNumber();
  let baseIndex = ROULETTE_SEQ.indexOf(targetNum);
  let targetIndex = (ROULETTE_SEQ.length * 3) + baseIndex; 
  
  // PENGUKURAN DINAMIS: Mengambil lebar elemen saat ini dari CSS layarnya
  let itemNode = document.querySelector('.wheel-number');
  let gap = parseInt(window.getComputedStyle(track).gap) || 4;
  let itemWidth = itemNode.offsetWidth + gap; 
  
  // Offset diambil dari lebar container KIRI saja, bukan seluruh window.innerWidth
  let centerOffset = document.querySelector('.wheel-container').offsetWidth / 2;
  let randomDrift = (Math.random() * (itemNode.offsetWidth - 10)) - ((itemNode.offsetWidth - 10)/2); 
  
  // Kalkulasi jarak akhir animasi
  let finalTransform = (targetIndex * itemWidth) - centerOffset + (itemNode.offsetWidth / 2) + randomDrift; 

  track.style.transition = 'none'; track.style.transform = `translateX(0px)`;
  void track.offsetWidth; 

  track.style.transition = 'transform 4.5s cubic-bezier(0.12, 0.85, 0.15, 1)';
  track.style.transform = `translateX(-${finalTransform}px)`;

  setTimeout(() => { resolveSpin(targetNum); }, 4700);
}

function resolveSpin(winNum) {
  let winAmount = calculatePayoutForNumber(winNum);
  let numColor = winNum === 0 ? 'var(--success)' : (RED_NUMS.includes(winNum) ? 'var(--danger)' : '#334155');

  const modal = document.getElementById('resultModal');
  const resNum = document.getElementById('resNumber');
  const resText = document.getElementById('resText');

  resNum.textContent = winNum; resNum.style.color = numColor;

  if (winAmount > 0) {
    currentUser.balance += winAmount; document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
    resText.className = 'result-payout'; resText.textContent = `+ ${winAmount.toLocaleString()}`;
    setBanner(`YOU WON ${winAmount.toLocaleString()}!`, true); confettiEngine.burst(80);
  } else {
    resText.className = 'result-zonk'; resText.textContent = `HOUSE WINS`;
    setBanner("BETTER LUCK NEXT TIME");
  }
  modal.classList.add('show');
}

function closeResult() {
  document.getElementById('resultModal').classList.remove('show');
  totalBet = 0; bets = {};
  document.getElementById('spinTotal').textContent = '';
  document.getElementById('btnSpin').disabled = false; document.getElementById('btnClear').disabled = false;
  document.querySelectorAll('.chip-placed').forEach(el => { el.style.display = 'none'; el.classList.remove('chip-update'); });
  isSpinning = false; setBanner("PLACE YOUR BETS");
  
  if(typeof api !== 'undefined' && api.saveProgress) {
    api.saveProgress(currentUser.username, currentUser.balance, currentUser.level||1, currentUser.exp||0).catch(()=>{});
  }
}

/**
 * ==============================================================
 * 6. CONFETTI ENGINE
 * ==============================================================
 */
const confettiEngine = {
  canvas: document.getElementById('confettiCanvas'), ctx: null, particles: [],
  colors: ['#d4af37', '#ffdf73', '#00e5ff', '#ff007f', '#ffffff'],
  init() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); this.run(); },
  resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  spawn(count) {
    for(let i=0; i<count; i++) {
      this.particles.push({
        x: this.canvas.width/2, y: this.canvas.height/2, vx: (Math.random()-0.5)*40, vy: (Math.random()-1)*40,
        size: Math.random()*12+6, color: this.colors[Math.floor(Math.random()*this.colors.length)],
        rot: Math.random()*360, rotSpd: (Math.random()-0.5)*25, life: 1
      });
    }
  },
  burst(count) { this.spawn(count); },
  run() {
    if(this.particles.length > 0) {
      this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height);
      this.particles.forEach((p, i) => {
        p.vy += 0.8; p.x += p.vx; p.y += p.vy; p.rot += p.rotSpd; p.life -= 0.015;
        this.ctx.save(); this.ctx.translate(p.x, p.y); this.ctx.rotate(p.rot*Math.PI/180);
        this.ctx.fillStyle = p.color; this.ctx.globalAlpha = Math.max(p.life, 0);
        this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); this.ctx.restore();
        if(p.y > this.canvas.height || p.life <= 0) this.particles.splice(i, 1);
      });
    } else { this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height); }
    requestAnimationFrame(() => this.run());
  }
};
confettiEngine.init();
