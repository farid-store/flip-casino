<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Roulette Deluxe - Royal Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  /* =========================================
     CSS VARIABLES - TEMA KASINO VIP PREMIUM
     ========================================= */
  :root {
    --bg-base: #030507;
    --bg-panel: #0a0e14;
    --bg-glass: rgba(10, 14, 20, 0.8);
    --gold-light: #fef08a;
    --gold-main: #eab308;
    --gold-dark: #a16207;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
    
    --danger: #ef4444;
    --danger-dark: #991b1b;
    --success: #10b981;
    --success-dark: #065f46;
    --black-bet: #1e293b;
    
    --font-title: 'Cinzel', serif;
    --font-ui: 'Montserrat', sans-serif;
    --font-digital: 'Orbitron', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    background: radial-gradient(circle at 50% 0%, #162032 0%, var(--bg-base) 100%);
    color: var(--text-light);
    font-family: var(--font-ui);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* =========================================
     TOP BAR
     ========================================= */
  .top-bar {
    background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(234, 179, 8, 0.15);
    padding: calc(10px + env(safe-area-inset-top)) 15px 10px;
    display: flex; justify-content: space-between; align-items: center; z-index: 100;
  }
  .btn-back { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s;}
  .btn-back:hover { background: var(--danger); color: white; box-shadow: 0 0 10px rgba(239,68,68,0.5);}
  
  .balance-display { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
  .balance-title { font-size: 9px; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; }
  .balance-amount { font-family: var(--font-digital); font-size: 18px; color: var(--gold-light); text-shadow: 0 0 10px rgba(234, 179, 8, 0.4); font-weight: bold;}

  /* =========================================
     ROULETTE WHEEL (HORIZONTAL TICKER)
     ========================================= */
  .wheel-container {
    width: 100%; padding: 15px 0; background: #000; border-bottom: 2px solid var(--gold-dark);
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8); height: 100px;
  }
  .wheel-selector {
    position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 4px; background: var(--gold-light); z-index: 10; box-shadow: 0 0 15px var(--gold-main);
  }
  .wheel-selector::before, .wheel-selector::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    border-left: 10px solid transparent; border-right: 10px solid transparent;
  }
  .wheel-selector::before { top: 0; border-top: 15px solid var(--gold-light); }
  .wheel-selector::after { bottom: 0; border-bottom: 15px solid var(--gold-light); }

  .wheel-track {
    display: flex; gap: 4px; transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
    will-change: transform;
  }
  .wheel-number {
    min-width: 50px; height: 60px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-title); font-size: 24px; font-weight: 800; color: white;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  }
  .bg-red { background: linear-gradient(135deg, var(--danger), var(--danger-dark)); }
  .bg-black { background: linear-gradient(135deg, #334155, #0f172a); }
  .bg-green { background: linear-gradient(135deg, var(--success), var(--success-dark)); }

  /* =========================================
     BETTING BOARD
     ========================================= */
  .board-container {
    flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; align-items: center;
  }
  .table-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-width: 400px; width: 100%;
  }
  
  .bet-spot {
    background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; height: 45px;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 16px; font-weight: 800;
    cursor: pointer; position: relative; transition: 0.2s; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .bet-spot:active { transform: scale(0.95); }
  
  .spot-red { background: linear-gradient(180deg, var(--danger), var(--danger-dark)); border-color: #f87171; }
  .spot-black { background: linear-gradient(180deg, #1e293b, #020617); border-color: #475569; }
  .spot-green { background: linear-gradient(180deg, var(--success), var(--success-dark)); border-color: #34d399; grid-column: span 3; font-size: 20px;}
  
  .spot-outside { background: #1e293b; color: var(--gold-main); font-family: var(--font-ui); font-size: 12px; border-color: var(--gold-dark);}
  .outside-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; max-width: 400px; width: 100%; margin-top: 4px; }

  /* Chip Placed Indicator */
  .chip-placed {
    position: absolute; top: -5px; right: -5px; background: var(--gold-main); color: #000;
    width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-digital); font-size: 8px; font-weight: 900; border: 2px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.8); z-index: 5; pointer-events: none;
  }

  /* =========================================
     CONTROL CONSOLE (CHIPS & SPIN)
     ========================================= */
  .control-console {
    background: var(--bg-panel); border-top: 2px solid var(--gold-dark);
    padding: 15px 15px calc(15px + env(safe-area-inset-bottom));
    border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
  }
  
  .chip-selector { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
  .chip-btn {
    flex: 1; aspect-ratio: 1/1; max-height: 50px; border-radius: 50%; border: 2px dashed #334155;
    background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-digital); font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .chip-btn.active { border: 2px solid var(--gold-main); background: rgba(234, 179, 8, 0.2); color: var(--gold-main); transform: translateY(-3px); box-shadow: 0 5px 10px rgba(234, 179, 8, 0.3);}

  .actions-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .btn-clear { background: transparent; border: 1px solid var(--text-muted); color: var(--text-light); border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer;}
  .btn-clear:active { background: rgba(255,255,255,0.1); }
  .btn-spin {
    background: linear-gradient(180deg, var(--gold-main), var(--gold-dark)); color: #000; border: none;
    padding: 15px; border-radius: 10px; font-family: var(--font-ui); font-weight: 900; font-size: 16px;
    cursor: pointer; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4); text-transform: uppercase; letter-spacing: 1px;
  }
  .btn-spin:active { transform: scale(0.98); }
  .btn-spin:disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }

  .info-banner { background: #000; border: 1px solid #333; padding: 6px; text-align: center; border-radius: 6px; margin-bottom: 10px; font-family: var(--font-digital); font-size: 12px; color: var(--info); letter-spacing: 1px;}
  .win-text { color: var(--gold-light); font-weight: bold; animation: pulse 0.5s infinite alternate;}
  @keyframes pulse { from { text-shadow: 0 0 5px var(--gold-main); } to { text-shadow: 0 0 15px var(--gold-light); } }

  /* OVERLAYS (JACKPOT / ZONK) */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000; opacity: 0; pointer-events: none; transition: 0.3s; flex-direction: column; backdrop-filter: blur(5px);}
  .overlay.show { opacity: 1; pointer-events: auto; }
  .result-num { font-family: var(--font-title); font-size: 100px; color: white; line-height: 1; margin-bottom: 10px; text-shadow: 0 10px 30px rgba(0,0,0,0.8);}
  .result-payout { font-family: var(--font-digital); font-size: 30px; color: var(--gold-light); font-weight: bold; }
  .result-zonk { font-family: var(--font-digital); font-size: 30px; color: var(--danger); font-weight: bold; }
  
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <!-- TOP BAR -->
  <header class="top-bar">
    <button class="btn-back" id="btnExit" onclick="saveAndExit()">⬅ LOBBY</button>
    <div class="balance-display">
      <div class="balance-title">CREDITS</div>
      <div class="balance-amount" id="displayBalance">0</div>
    </div>
  </header>

  <!-- WHEEL TICKER -->
  <div class="wheel-container">
    <div class="wheel-selector"></div>
    <div class="wheel-track" id="wheelTrack">
      <!-- Generated via JS -->
    </div>
  </div>

  <!-- BETTING BOARD -->
  <div class="board-container">
    <div class="table-grid" id="bettingBoard">
      <!-- 0 Green -->
      <div class="bet-spot spot-green" onclick="placeBet('0')">0<div class="chip-placed" style="display:none;" id="chip-0">0</div></div>
      <!-- Numbers 1-36 generated via JS -->
    </div>
    
    <!-- Outside Bets -->
    <div class="outside-grid">
      <div class="bet-spot spot-outside" onclick="placeBet('EVEN')">EVEN<div class="chip-placed" style="display:none;" id="chip-EVEN">0</div></div>
      <div class="bet-spot spot-outside" onclick="placeBet('ODD')">ODD<div class="chip-placed" style="display:none;" id="chip-ODD">0</div></div>
      <div class="bet-spot spot-outside spot-red" style="font-family: var(--font-ui);" onclick="placeBet('RED')">RED<div class="chip-placed" style="display:none;" id="chip-RED">0</div></div>
      <div class="bet-spot spot-outside spot-black" style="font-family: var(--font-ui);" onclick="placeBet('BLACK')">BLACK<div class="chip-placed" style="display:none;" id="chip-BLACK">0</div></div>
    </div>
  </div>

  <!-- CONTROL CONSOLE -->
  <div class="control-console">
    <div class="info-banner" id="infoBanner">PLACE YOUR BETS</div>
    
    <div class="chip-selector">
      <button class="chip-btn active" onclick="selectChip(100)">100</button>
      <button class="chip-btn" onclick="selectChip(500)">500</button>
      <button class="chip-btn" onclick="selectChip(1000)">1K</button>
      <button class="chip-btn" onclick="selectChip(5000)">5K</button>
      <button class="chip-btn" onclick="selectChip(10000)">10K</button>
    </div>

    <div class="actions-row">
      <button class="btn-clear" id="btnClear" onclick="clearBets()">CLEAR BETS</button>
      <button class="btn-spin" id="btnSpin" onclick="spinWheel()">SPIN (Total: 0)</button>
    </div>
  </div>

  <!-- MODAL RESULT -->
  <div class="overlay" id="resultModal" onclick="closeResult()">
    <div class="result-num" id="resNumber">0</div>
    <div id="resText"></div>
    <p style="color: #94a3b8; font-size: 11px; margin-top: 20px;">Tap anywhere to continue</p>
  </div>

<script src="api.js"></script>
<script>
/**
 * ==============================================================
 * 1. AUTH & SETUP
 * ==============================================================
 */
const userJson = localStorage.getItem('currentUser');
if (!userJson) window.location.href = 'auth.html';
let currentUser = JSON.parse(userJson);
let playerWinRate = 0.15; // Default pity

// Sync RTP
if (typeof api !== 'undefined' && api.getDatabase) {
  api.getDatabase().then(db => {
    if (db && db.users) {
      const freshUser = db.users.find(u => u.username === currentUser.username);
      if (freshUser) {
        if (freshUser.winRate !== undefined) playerWinRate = parseFloat(freshUser.winRate) / 100;
        currentUser.balance = freshUser.balance;
        document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
      }
    }
  }).catch(e => console.error(e));
}

document.getElementById('displayBalance').textContent = (currentUser.balance || 0).toLocaleString();

async function saveAndExit() {
  document.getElementById('btnExit').textContent = "SAVING...";
  try {
    if (typeof api !== 'undefined' && api.saveProgress) {
      await api.saveProgress(currentUser.username, currentUser.balance, currentUser.level || 1, currentUser.exp || 0);
    }
  } catch(e) {} finally { window.location.href = 'index.html'; }
}

/**
 * ==============================================================
 * 2. ROULETTE LOGIC & BOARD GENERATION
 * ==============================================================
 */
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const ROULETTE_SEQ = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

let currentChip = 100;
let bets = {}; // ex: { '0': 100, 'RED': 500 }
let totalBet = 0;
let isSpinning = false;

// Generate Board (1 to 36)
const board = document.getElementById('bettingBoard');
for(let i=1; i<=36; i++) {
  let isRed = RED_NUMS.includes(i);
  let colorClass = isRed ? 'spot-red' : 'spot-black';
  let spot = document.createElement('div');
  spot.className = `bet-spot ${colorClass}`;
  spot.innerHTML = `${i}<div class="chip-placed" style="display:none;" id="chip-${i}">0</div>`;
  spot.onclick = () => placeBet(i.toString());
  board.appendChild(spot);
}

// Generate Wheel Track (Duplicate sequence for infinite scrolling effect)
const track = document.getElementById('wheelTrack');
function buildTrack() {
  track.innerHTML = '';
  // 5 sets of sequences to make it long enough to scroll fast
  for(let loop=0; loop<5; loop++) {
    ROULETTE_SEQ.forEach(num => {
      let colorClass = num === 0 ? 'bg-green' : (RED_NUMS.includes(num) ? 'bg-red' : 'bg-black');
      let item = document.createElement('div');
      item.className = `wheel-number ${colorClass}`;
      item.textContent = num;
      track.appendChild(item);
    });
  }
}
buildTrack();

/**
 * ==============================================================
 * 3. BETTING SYSTEM
 * ==============================================================
 */
function selectChip(val) {
  if (isSpinning) return;
  currentChip = val;
  document.querySelectorAll('.chip-btn').forEach(btn => {
    btn.classList.remove('active');
    if(parseInt(btn.textContent.replace('K','000')) === val) btn.classList.add('active');
  });
}

function formatChip(val) {
  if (val >= 1000) return (val/1000) + 'K';
  return val;
}

function placeBet(spotId) {
  if (isSpinning) return;
  if (currentUser.balance < currentChip) {
    setBanner("INSUFFICIENT BALANCE!");
    return;
  }

  currentUser.balance -= currentChip;
  totalBet += currentChip;
  
  if (!bets[spotId]) bets[spotId] = 0;
  bets[spotId] += currentChip;
  
  // Update UI
  document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
  document.getElementById('btnSpin').textContent = `SPIN (${totalBet.toLocaleString()})`;
  
  const chipUI = document.getElementById(`chip-${spotId}`);
  chipUI.style.display = 'flex';
  chipUI.textContent = formatChip(bets[spotId]);
  
  setBanner("BET ACCEPTED");
}

function clearBets() {
  if (isSpinning || totalBet === 0) return;
  
  currentUser.balance += totalBet;
  totalBet = 0;
  bets = {};
  
  document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
  document.getElementById('btnSpin').textContent = `SPIN (Total: 0)`;
  document.querySelectorAll('.chip-placed').forEach(el => el.style.display = 'none');
  setBanner("BETS CLEARED");
}

function setBanner(msg, isWin=false) {
  const banner = document.getElementById('infoBanner');
  banner.textContent = msg;
  if(isWin) banner.classList.add('win-text');
  else banner.classList.remove('win-text');
}

/**
 * ==============================================================
 * 4. RTP & RIGGING ENGINE (SCRAMBLER)
 * ==============================================================
 */
function calculatePayoutForNumber(num) {
  let payout = 0;
  
  // Straight Bet
  if (bets[num.toString()]) payout += bets[num.toString()] * 36;
  
  // Outside Bets
  if (num !== 0) {
    let isRed = RED_NUMS.includes(num);
    let isEven = num % 2 === 0;
    
    if (isRed && bets['RED']) payout += bets['RED'] * 2;
    if (!isRed && bets['BLACK']) payout += bets['BLACK'] * 2;
    
    if (isEven && bets['EVEN']) payout += bets['EVEN'] * 2;
    if (!isEven && bets['ODD']) payout += bets['ODD'] * 2;
  }
  
  return payout;
}

function determineWinningNumber() {
  // If no bets, just pick random
  if (Object.keys(bets).length === 0) return ROULETTE_SEQ[Math.floor(Math.random() * ROULETTE_SEQ.length)];

  // RTP Check
  let forceWin = (Math.random() < playerWinRate);
  let possibleOutcomes = [];

  for(let i=0; i<=36; i++) {
    let payout = calculatePayoutForNumber(i);
    let netResult = payout - totalBet;
    possibleOutcomes.push({ num: i, net: netResult, payout: payout });
  }

  if (forceWin) {
    // Mode MENANG: Cari angka yang bikin player profit
    let winPool = possibleOutcomes.filter(o => o.net > 0);
    if (winPool.length > 0) {
      let pick = winPool[Math.floor(Math.random() * winPool.length)];
      return pick.num;
    }
    // Jika player pasangnya aneh (tidak ada yang profit), biarkan acak
    return ROULETTE_SEQ[Math.floor(Math.random() * ROULETTE_SEQ.length)];
  } else {
    // Mode ZONK (ANTI-MENANG MUTLAK): Cari angka yang bikin player RUGI atau mentok BALIK MODAL
    let losePool = possibleOutcomes.filter(o => o.net <= 0);
    if (losePool.length > 0) {
      // Prioritaskan ZONK mutlak (net < 0) jika ada
      let strictZonk = losePool.filter(o => o.net < 0);
      if(strictZonk.length > 0 && Math.random() > 0.2) {
        return strictZonk[Math.floor(Math.random() * strictZonk.length)].num;
      }
      return losePool[Math.floor(Math.random() * losePool.length)].num;
    }
    // Fallback ekstrim (jika player menutupi seluruh papan): Cari payout paling kecil
    possibleOutcomes.sort((a,b) => a.payout - b.payout);
    return possibleOutcomes[0].num; 
  }
}

/**
 * ==============================================================
 * 5. SPIN ANIMATION & RESOLUTION
 * ==============================================================
 */
let lastWinNumber = 0;
let winAmount = 0;

function spinWheel() {
  if (isSpinning) return;
  if (totalBet === 0) return setBanner("PLACE A BET FIRST!");

  isSpinning = true;
  document.getElementById('btnSpin').disabled = true;
  document.getElementById('btnClear').disabled = true;
  setBanner("WHEEL IS SPINNING...");

  // 1. Tentukan Angka Kemenangan via RTP Engine
  let targetNum = determineWinningNumber();
  
  // 2. Kalkulasi posisi visual di wheel track
  // Kita ingin berhenti di urutan (targetNum) di 'loop' ke-3 atau ke-4 agar animasinya panjang
  let baseIndex = ROULETTE_SEQ.indexOf(targetNum);
  let targetIndex = (ROULETTE_SEQ.length * 3) + baseIndex; // Putar 3 ronde penuh
  
  // Lebar 1 item = min-width 50px + gap 4px = 54px. Kita hitung offset
  let itemWidth = 54;
  let centerOffset = window.innerWidth / 2; // Garis tengah layar
  
  // Tambahkan sedikit random pixel agar berhentinya tidak pas di tengah kotak (lebih realistis)
  let randomDrift = (Math.random() * 30) - 15; 
  
  let finalTransform = (targetIndex * itemWidth) - centerOffset + 25 + randomDrift; 

  // Reset track ke posisi 0 instan
  track.style.transition = 'none';
  track.style.transform = `translateX(0px)`;
  
  // Pemicu reflow DOM
  void track.offsetWidth; 

  // Jalankan Animasi
  track.style.transition = 'transform 4s cubic-bezier(0.1, 0.9, 0.2, 1)';
  track.style.transform = `translateX(-${finalTransform}px)`;

  // Tunggu animasi selesai
  setTimeout(() => {
    resolveSpin(targetNum);
  }, 4200);
}

function resolveSpin(winNum) {
  lastWinNumber = winNum;
  winAmount = calculatePayoutForNumber(winNum);

  let numColor = winNum === 0 ? 'var(--success)' : (RED_NUMS.includes(winNum) ? 'var(--danger)' : '#334155');

  const modal = document.getElementById('resultModal');
  const resNum = document.getElementById('resNumber');
  const resText = document.getElementById('resText');

  resNum.textContent = winNum;
  resNum.style.color = numColor;

  if (winAmount > 0) {
    currentUser.balance += winAmount;
    document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
    resText.className = 'result-payout';
    resText.textContent = `+ ${winAmount.toLocaleString()} CREDITS`;
    setBanner(`YOU WON ${winAmount.toLocaleString()}!`, true);
    confettiEngine.burst(60);
  } else {
    resText.className = 'result-zonk';
    resText.textContent = `NO WIN`;
    setBanner("NO WIN. TRY AGAIN.");
  }

  modal.classList.add('show');
}

function closeResult() {
  document.getElementById('resultModal').classList.remove('show');
  
  // Reset Table for next round
  totalBet = 0;
  bets = {};
  document.getElementById('btnSpin').textContent = `SPIN (Total: 0)`;
  document.getElementById('btnSpin').disabled = false;
  document.getElementById('btnClear').disabled = false;
  document.querySelectorAll('.chip-placed').forEach(el => el.style.display = 'none');
  
  isSpinning = false;
  setBanner("PLACE YOUR BETS");
  
  // Save progress in background
  if(typeof api !== 'undefined' && api.saveProgress) {
    api.saveProgress(currentUser.username, currentUser.balance, currentUser.level||1, currentUser.exp||0).catch(()=>{});
  }
}

/**
 * ==============================================================
 * 6. CONFETTI ENGINE (Sama dengan Slot)
 * ==============================================================
 */
const confettiEngine = {
  canvas: document.getElementById('confettiCanvas'), ctx: null, particles: [], isActive: false,
  colors: ['#d4af37', '#ffdf73', '#00e5ff', '#ff007f', '#ffffff'],
  init() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); this.run(); },
  resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  spawn(count) {
    for(let i=0; i<count; i++) {
      this.particles.push({
        x: this.canvas.width/2, y: this.canvas.height/2, vx: (Math.random()-0.5)*35, vy: (Math.random()-1)*35,
        size: Math.random()*12+6, color: this.colors[Math.floor(Math.random()*this.colors.length)],
        rot: Math.random()*360, rotSpd: (Math.random()-0.5)*20, life: 1
      });
    }
  },
  burst(count) { this.spawn(count); },
  run() {
    if(this.particles.length > 0) {
      this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height);
      this.particles.forEach((p, i) => {
        p.vy += 0.8; p.x += p.vx; p.y += p.vy; p.rot += p.rotSpd; p.life -= 0.015;
        this.ctx.save(); this.ctx.translate(p.x, p.y); this.ctx.rotate(p.rot*Math.PI/180);
        this.ctx.fillStyle = p.color; this.ctx.globalAlpha = Math.max(p.life, 0);
        this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); this.ctx.restore();
        if(p.y > this.canvas.height || p.life <= 0) this.particles.splice(i, 1);
      });
    } else { this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height); }
    requestAnimationFrame(() => this.run());
  }
};
confettiEngine.init();

</script>
