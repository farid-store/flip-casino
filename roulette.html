<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Roulette Deluxe - VIP Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  /* =========================================
     CSS VARIABLES - TEMA KASINO VIP PREMIUM
     ========================================= */
  :root {
    --bg-base: #040404;
    --bg-panel: #161b22;
    --bg-glass: rgba(255, 255, 255, 0.05);
    
    --gold-light: #FFD700;
    --gold-main: #F8C851;
    --gold-dark: #B8860B;
    --gold-glow: 0 0 20px rgba(255, 215, 0, 0.3);
    
    --text-light: #E8EDF5;
    --text-muted: #93A3B8;
    
    --danger: #D92D43;
    --danger-dark: #8E1024;
    --success: #1FC66A;
    --success-dark: #0B8E46;
    
    --font-title: 'Cinzel', serif;
    --font-ui: 'Montserrat', sans-serif;
    --font-digital: 'Orbitron', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    background: radial-gradient(circle at top, #1f2430 0%, #090b10 40%, var(--bg-base) 100%);
    color: var(--text-light);
    font-family: var(--font-ui);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* AMBIENT EFFECTS */
  .background-noise {
    position: fixed; inset: 0; opacity: 0.05;
    background-image: radial-gradient(#ffffff 1px, transparent 1px);
    background-size: 5px 5px; pointer-events: none; z-index: 1;
  }
  .ambient-light {
    position: fixed; width: 900px; height: 900px; left: 50%; top: -450px;
    transform: translateX(-50%); background: radial-gradient(circle, rgba(255,215,0,0.12), transparent 70%);
    filter: blur(40px); animation: ambientMove 10s ease-in-out infinite; pointer-events: none; z-index: 0;
  }
  @keyframes ambientMove { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

  /* =========================================
     TOP BAR (PREMIUM GLASS)
     ========================================= */
  .top-bar {
    background: linear-gradient(180deg, rgba(25,28,35,0.96), rgba(12,15,20,0.94));
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255, 215, 0, 0.08);
    padding: calc(10px + env(safe-area-inset-top)) 24px 10px;
    display: flex; justify-content: space-between; align-items: center; z-index: 100;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
  }
  
  .btn-back { 
    background: linear-gradient(180deg, #262d39, #171d26); border: 1px solid rgba(255,255,255,0.08); 
    color: #fff; padding: 10px 22px; border-radius: 14px; font-weight: 700; font-size: 11px; 
    cursor: pointer; text-transform: uppercase; transition: 0.25s; letter-spacing: 1px;
  }
  .btn-back:hover, .btn-back:active { 
    border-color: var(--gold-light); box-shadow: 0 0 25px rgba(255,215,0,0.25); transform: translateY(-2px);
  }
  
  .balance-display { 
    background: linear-gradient(180deg, rgba(255,215,0,0.08), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,215,0,0.15); padding: 8px 16px; border-radius: 16px;
    text-align: right; display: flex; flex-direction: column; align-items: flex-end; min-width: 150px;
  }
  .balance-title { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 3px; margin-bottom: 2px;}
  .balance-amount { font-family: var(--font-digital); font-size: 22px; color: var(--gold-light); text-shadow: var(--gold-glow); font-weight: 900;}

  /* =========================================
     MAIN GAME LAYOUT
     ========================================= */
  .game-layout { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative; z-index: 5; }
  
  /* KIRI: ROULETTE WHEEL & STATS */
  .left-pane {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    border-bottom: 1px solid rgba(255,255,255,0.06); position: relative; padding: 25px 20px 10px; gap: 15px;
  }
  
  .live-indicator {
    position: absolute; top: 15px; left: 20px;
    background: rgba(255,0,0,0.08); border: 1px solid rgba(255,0,0,0.25); border-radius: 14px;
    padding: 6px 14px; font-family: var(--font-digital); font-size: 11px; color: #fff; 
    font-weight: bold; letter-spacing: 2px; display: flex; align-items: center; gap: 8px;
  }
  .live-dot { width: 10px; height: 10px; background: #ff2c55; border-radius: 50%; box-shadow: 0 0 15px #ff2c55; animation: liveBlink 0.9s infinite alternate;}
  @keyframes liveBlink { from { opacity: 1; } to { opacity: 0.2; } }

  .wheel-wrapper {
    position: relative; width: 100%; height: 140px; border-radius: 20px; overflow: hidden;
    background: #080909; display: flex; justify-content: center; align-items: center;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 20px 40px rgba(0,0,0,0.4);
  }
  .wheel-shadow { position: absolute; inset: 0; background: radial-gradient(circle, transparent 45%, rgba(0,0,0,0.65)); pointer-events: none; z-index: 10; }
  
  .wheel-container { width: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100%; perspective: 1000px;}
  .wheel-selector {
    position: absolute; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #fff; z-index: 20; 
    box-shadow: 0 0 30px rgba(255,215,0,0.8);
  }
  .selector-light {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px; border-radius: 50%; background: rgba(255,215,0,0.35); filter: blur(12px); z-index: 15;
  }

  .wheel-track { display: flex; gap: 6px; padding: 0 80px; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
  .wheel-number {
    min-width: 60px; height: 80px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-title); font-size: 28px; font-weight: 800; color: white;
    box-shadow: inset 0 2px 10px rgba(255,255,255,0.2), inset 0 -4px 10px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1); text-shadow: 1px 2px 4px rgba(0,0,0,0.8);
  }
  .bg-red { background: linear-gradient(180deg, #ef4a62, #99182c); }
  .bg-black { background: linear-gradient(180deg, #414141, #111111); }
  .bg-green { background: linear-gradient(180deg, #29dd80, #0f8b49); }

  /* PREMIUM HISTORY & STATS */
  .stats-panel { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
  .history-bar { display: flex; gap: 6px; overflow-x: hidden; padding: 5px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);}
  .history-item { 
    width: 28px; height: 28px; min-width: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
    font-family: var(--font-digital); font-size: 11px; font-weight: 700; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    animation: popup 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .history-item.red { background: var(--danger); }
  .history-item.black { background: #111; border: 1px solid #444; }
  .history-item.green { background: var(--success); }
  .live-stats { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); font-weight: bold; letter-spacing: 1px; padding: 0 5px;}
  .live-stats span { font-family: var(--font-digital); color: var(--gold-light); margin-left: 5px; font-size: 12px;}

  /* KANAN: BOARD & CONTROL */
  .right-pane { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent); }
  
  .board-container { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; }
  .board-container::-webkit-scrollbar { width: 6px; }
  .board-container::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 10px; }

  .table-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 440px; width: 100%; 
    background: linear-gradient(180deg, #0f2c17, #0b1d11); padding: 15px; border-radius: 22px; border: 2px solid rgba(255,215,0,0.15);
    box-shadow: inset 0 0 80px rgba(0,0,0,0.55), 0 20px 60px rgba(0,0,0,0.35);
  }
  
  .bet-spot {
    height: 55px; display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 20px; font-weight: 700;
    cursor: pointer; position: relative; transition: 0.25s; color: white; border-radius: 12px; overflow: hidden;
  }
  .bet-spot::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.22), transparent); opacity: 0.5;
  }
  .bet-spot:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.35); filter: brightness(1.15); }
  .bet-spot:active { transform: scale(0.96); }
  
  .spot-red { background: linear-gradient(180deg, #ef4a62, #99182c); }
  .spot-black { background: linear-gradient(180deg, #414141, #111111); }
  .spot-green { background: linear-gradient(180deg, #29dd80, #0f8b49); grid-column: span 3; font-size: 26px; height: 65px;}
  
  .outside-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 440px; width: 100%; margin-top: 15px; }
  .spot-outside { 
    height: 60px; font-family: var(--font-ui); font-size: 15px; letter-spacing: 1px; color: #fff;
    background: linear-gradient(180deg, #364152, #202631); 
  }
  .spot-outside.spot-red { background: linear-gradient(180deg, #d73d55, #861425); }
  .spot-outside.spot-black { background: linear-gradient(180deg, #434343, #0d0d0d); }

  /* Animated Premium Chip */
  .chip-placed {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff6b5, #f2c238, #9b6900); color: #111;
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-digital); font-size: 10px; font-weight: 800; border: 3px solid #fff; 
    box-shadow: 0 8px 18px rgba(0,0,0,0.45); z-index: 20; pointer-events: none; 
    animation: chipDrop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes chipDrop { 0% { transform: translate(-50%, -150%) scale(1.6); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .chip-update { animation: chipPulse 0.3s ease forwards !important; }
  @keyframes chipPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } }

  /* CONTROL CONSOLE */
  .control-console {
    background: linear-gradient(180deg, rgba(24,27,34,0.98), rgba(14,16,21,0.98));
    border-top: 1px solid rgba(255,255,255,0.05); padding: 15px 20px calc(15px + env(safe-area-inset-bottom));
    box-shadow: 0 -15px 40px rgba(0,0,0,0.7); position: relative; z-index: 100;
  }
  
  .info-banner { 
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); padding: 10px; text-align: center; border-radius: 12px; margin-bottom: 15px; 
    font-family: var(--font-digital); font-size: 14px; color: var(--gold-light); font-weight: 700; letter-spacing: 2px; max-width: 500px; margin-left: auto; margin-right: auto; transition: 0.3s;
  }
  .win-text { background: rgba(31, 198, 106, 0.2); border-color: var(--success); color: var(--success); text-shadow: 0 0 10px rgba(31,198,106,0.5);}
  
  .chip-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; max-width: 500px; margin-left: auto; margin-right: auto;}
  .chip-btn {
    flex: 1; aspect-ratio: 1/1; max-width: 60px; border-radius: 50%; border: 4px dashed rgba(255,255,255,0.5); 
    background: radial-gradient(circle, #364152 0%, #1e293b 100%); color: #fff; 
    display: flex; align-items: center; justify-content: center; font-family: var(--font-digital); font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.25s;
  }
  .chip-btn.active { 
    border-color: #fff; background: radial-gradient(circle, #ffe278, #c99817); color: #111; 
    transform: translateY(-8px) scale(1.1); box-shadow: 0 0 30px rgba(255,215,0,0.45);
  }

  .actions-row { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; max-width: 500px; margin: 0 auto; }
  .btn-clear { background: #232831; border: none; color: #fff; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;}
  .btn-clear:hover { background: #2d3542; }
  .btn-clear:active { transform: scale(0.95); }
  
  .btn-spin {
    background: linear-gradient(180deg, #ffe37a, #c79518); color: #111; border: none; padding: 16px; border-radius: 14px; 
    font-family: var(--font-ui); font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 0 35px rgba(255,215,0,0.35); 
    text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .btn-spin::before { 
    content: ''; position: absolute; top: 0; left: -120%; width: 70%; height: 100%; 
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent); animation: shine 2.8s infinite; 
  }
  @keyframes shine { 100% { left: 160%; } }
  .btn-spin:active { transform: scale(0.96); box-shadow: 0 2px 10px var(--gold-glow); }
  .btn-spin:disabled { filter: grayscale(1); opacity: 0.6; pointer-events: none; box-shadow: none; }
  .btn-spin:disabled::before { display: none; }

  /* OVERLAYS (JACKPOT / ZONK) */
  .overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; justify-content: center; align-items: center; z-index: 9999; 
    opacity: 0; pointer-events: none; transition: 0.35s; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content { 
    background: linear-gradient(180deg, #1b2029, #0d1015); border: 2px solid rgba(255,215,0,0.18);
    box-shadow: 0 35px 90px rgba(0,0,0,0.6), 0 0 45px rgba(255,215,0,0.18); border-radius: 28px;
    padding: 45px; width: 90%; max-width: 420px; text-align: center; transform: scale(0.75); opacity: 0; transition: 0.45s cubic-bezier(.2,.8,.2,1); 
  }
  .overlay.show .modal-content { transform: scale(1); opacity: 1; }
  
  .result-label { font-size: 14px; color: #9aa3b2; font-weight: 700; letter-spacing: 4px; margin-bottom: 15px;}
  .result-num { font-family: var(--font-title); font-size: 100px; color: var(--gold-light); line-height: 1; margin-bottom: 10px; text-shadow: 0 0 40px rgba(255,215,0,0.45);}
  .result-payout { font-family: var(--font-digital); font-size: 32px; color: var(--success); font-weight: 700;}
  .result-zonk { font-family: var(--font-digital); font-size: 32px; color: var(--danger); font-weight: 700;}
  .tap-continue { color: #888; font-size: 12px; margin-top: 30px; letter-spacing: 3px; animation: blink 1.3s infinite alternate;}
  @keyframes blink { from { opacity: 1; } to { opacity: 0.25; } }

  /* TOAST NOTIFICATION */
  .toast-message {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 14px 26px; border-radius: 15px;
    background: rgba(20,22,28,0.96); border: 1px solid rgba(255,215,0,0.2); font-weight: 600; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 99999;
  }
  .toast-message.show { opacity: 1; bottom: 80px; }

  /* =========================================
     RESPONSIVE DESKTOP
     ========================================= */
  @media (min-width: 1024px) {
    .game-layout { flex-direction: row; }
    .left-pane { width: 45%; border-bottom: none; border-right: 1px solid rgba(255,255,255,0.06); padding: 40px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 10; justify-content: flex-start;}
    .wheel-wrapper { height: 180px; }
    .wheel-number { min-width: 70px; height: 100px; font-size: 34px; }
    .live-indicator { top: 30px; left: 30px; font-size: 13px; }
    .stats-panel { margin-top: 30px; }
    
    .right-pane { width: 55%; justify-content: space-between; }
    .board-container { justify-content: center; } 
    .table-grid, .outside-grid { max-width: 520px; gap: 8px;}
    .bet-spot { height: 60px; font-size: 22px; }
    .spot-green { height: 75px; font-size: 28px; }
    .control-console { border-radius: 0; padding-top: 25px; padding-bottom: 25px;}
  }
</style>
</head>
<body>

  <!-- AMBIENT BACKGROUND -->
  <div class="ambient-light"></div>
  <div class="background-noise"></div>
  <canvas id="confettiCanvas"></canvas>

  <header class="top-bar">
    <button class="btn-back" id="btnExit" onclick="saveAndExit()">⬅ LOBBY</button>
    <div class="balance-display">
      <div class="balance-title">BALANCE</div>
      <div class="balance-amount" id="displayBalance">0</div>
    </div>
  </header>

  <div class="game-layout">
    
    <!-- KIRI: ROULETTE WHEEL & STATS -->
    <div class="left-pane">
      <div class="live-indicator"><span class="live-dot"></span> LIVE VIP</div>
      <div class="wheel-wrapper">
        <div class="wheel-shadow"></div>
        <div class="wheel-container">
          <div class="selector-light"></div>
          <div class="wheel-selector"></div>
          <div class="wheel-track" id="wheelTrack">
            <!-- Generated via JS -->
          </div>
        </div>
      </div>
      
      <!-- PREMIUM STATS -->
      <div class="stats-panel">
        <div class="history-bar" id="historyBar">
          <!-- Generated via JS -->
        </div>
        <div class="live-stats">
          <div>HOT: <span id="hotNumber">-</span></div>
          <div>COLD: <span id="coldNumber">-</span></div>
          <div>SPINS: <span id="statSpin">0</span></div>
        </div>
      </div>
    </div>

    <!-- KANAN: BETTING BOARD & CONTROLS -->
    <div class="right-pane">
      <div class="board-container">
        <div class="table-grid" id="bettingBoard">
          <!-- 0 Green -->
          <div class="bet-spot spot-green" onclick="placeBet('0')">0<div class="chip-placed" style="display:none;" id="chip-0">0</div></div>
        </div>
        
        <!-- Outside Bets -->
        <div class="outside-grid">
          <div class="bet-spot spot-outside" onclick="placeBet('EVEN')">EVEN<div class="chip-placed" style="display:none;" id="chip-EVEN">0</div></div>
          <div class="bet-spot spot-outside" onclick="placeBet('ODD')">ODD<div class="chip-placed" style="display:none;" id="chip-ODD">0</div></div>
          <div class="bet-spot spot-outside spot-red" onclick="placeBet('RED')">RED<div class="chip-placed" style="display:none;" id="chip-RED">0</div></div>
          <div class="bet-spot spot-outside spot-black" onclick="placeBet('BLACK')">BLACK<div class="chip-placed" style="display:none;" id="chip-BLACK">0</div></div>
        </div>
      </div>

      <div class="control-console">
        <div class="info-banner" id="infoBanner">PLACE YOUR BETS</div>
        
        <div class="chip-selector">
          <button class="chip-btn active" onclick="selectChip(100)">100</button>
          <button class="chip-btn" onclick="selectChip(500)">500</button>
          <button class="chip-btn" onclick="selectChip(1000)">1K</button>
          <button class="chip-btn" onclick="selectChip(5000)">5K</button>
          <button class="chip-btn" onclick="selectChip(10000)">10K</button>
        </div>

        <div class="actions-row">
          <button class="btn-clear" id="btnClear" onclick="clearBets()">CLEAR</button>
          <button class="btn-spin" id="btnSpin" onclick="spinWheel()">SPIN <span id="spinTotal"></span></button>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL RESULT -->
  <div class="overlay" id="resultModal" onclick="closeResult()">
    <div class="modal-content">
      <div class="result-label" id="resLabel">WINNING NUMBER</div>
      <div class="result-num" id="resNumber">0</div>
      <div id="resText"></div>
      <div class="tap-continue">TAP ANYWHERE TO CONTINUE</div>
    </div>
  </div>

<script src="api.js"></script>
<script>
/**
 * ==============================================================
 * 1. AUTH & SETUP (Dipertahankan)
 * ==============================================================
 */
const userJson = localStorage.getItem('currentUser');
if (!userJson) window.location.href = 'auth.html';
let currentUser = JSON.parse(userJson) || { username: 'Guest', balance: 50000 };
let playerWinRate = 0.15;

if (typeof api !== 'undefined' && api.getDatabase) {
  api.getDatabase().then(db => {
    if (db && db.users) {
      const freshUser = db.users.find(u => u.username === currentUser.username);
      if (freshUser) {
        if (freshUser.winRate !== undefined) playerWinRate = parseFloat(freshUser.winRate) / 100;
        currentUser.balance = freshUser.balance;
        document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
      }
    }
  }).catch(e => console.error(e));
}
document.getElementById('displayBalance').textContent = (currentUser.balance || 0).toLocaleString();

async function saveAndExit() {
  document.getElementById('btnExit').textContent = "SAVING...";
  try {
    if (typeof api !== 'undefined' && api.saveProgress) {
      await api.saveProgress(currentUser.username, currentUser.balance, currentUser.level || 1, currentUser.exp || 0);
    }
  } catch(e) {} finally { window.location.href = 'index.html'; }
}

/**
 * ==============================================================
 * 2. BOARD & ROULETTE GENERATION
 * ==============================================================
 */
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const ROULETTE_SEQ = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

let currentChip = 100;
let bets = {}; 
let totalBet = 0;
let isSpinning = false;

const board = document.getElementById('bettingBoard');
for(let i=1; i<=36; i++) {
  let isRed = RED_NUMS.includes(i);
  let colorClass = isRed ? 'spot-red' : 'spot-black';
  let spot = document.createElement('div');
  spot.className = `bet-spot ${colorClass}`;
  spot.innerHTML = `${i}<div class="chip-placed" style="display:none;" id="chip-${i}">0</div>`;
  spot.onclick = () => placeBet(i.toString());
  board.appendChild(spot);
}

const track = document.getElementById('wheelTrack');
function buildTrack() {
  track.innerHTML = '';
  for(let loop=0; loop<5; loop++) {
    ROULETTE_SEQ.forEach(num => {
      let colorClass = num === 0 ? 'bg-green' : (RED_NUMS.includes(num) ? 'bg-red' : 'bg-black');
      let item = document.createElement('div');
      item.className = `wheel-number ${colorClass}`;
      item.textContent = num;
      track.appendChild(item);
    });
  }
}
buildTrack();

/**
 * ==============================================================
 * 3. BETTING SYSTEM & PREMIUM TOAST
 * ==============================================================
 */
function premiumToast(text, color="#FFD700") {
  let toast = document.getElementById("premiumToast");
  if(!toast) {
    toast = document.createElement("div");
    toast.id = "premiumToast";
    toast.className = "toast-message";
    document.body.appendChild(toast);
  }
  toast.textContent = text;
  toast.style.borderColor = color;
  toast.style.boxShadow = `0 0 25px ${color}`;
  toast.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { toast.classList.remove("show"); }, 2200);
}

function selectChip(val) {
  if (isSpinning) return;
  currentChip = val;
  document.querySelectorAll('.chip-btn').forEach(btn => {
    btn.classList.remove('active');
    let btnVal = btn.textContent;
    btnVal = btnVal.includes('K') ? parseInt(btnVal.replace('K','')) * 1000 : parseInt(btnVal);
    if(btnVal === val) btn.classList.add('active');
  });
}

function formatChip(val) { return val >= 1000 ? (val/1000) + 'K' : val; }

function placeBet(spotId) {
  if (isSpinning) return;
  if (currentUser.balance < currentChip) return setBanner("INSUFFICIENT BALANCE!");

  currentUser.balance -= currentChip;
  totalBet += currentChip;
  if (!bets[spotId]) bets[spotId] = 0;
  bets[spotId] += currentChip;
  
  document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
  document.getElementById('spinTotal').textContent = `(${formatChip(totalBet)})`;
  
  const chipUI = document.getElementById(`chip-${spotId}`);
  chipUI.style.display = 'flex';
  chipUI.textContent = formatChip(bets[spotId]);
  chipUI.classList.remove('chip-update');
  void chipUI.offsetWidth; 
  chipUI.classList.add('chip-update');
  
  setBanner("BET ACCEPTED");
}

function clearBets() {
  if (isSpinning || totalBet === 0) return;
  currentUser.balance += totalBet; totalBet = 0; bets = {};
  
  document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
  document.getElementById('spinTotal').textContent = '';
  document.querySelectorAll('.chip-placed').forEach(el => { el.style.display = 'none'; el.classList.remove('chip-update'); });
  setBanner("ALL BETS CLEARED");
}

function setBanner(msg, isWin=false) {
  const banner = document.getElementById('infoBanner');
  banner.textContent = msg;
  if(isWin) banner.classList.add('win-text'); else banner.classList.remove('win-text');
}

/**
 * ==============================================================
 * 4. RTP & RIGGING ENGINE (Dipertahankan)
 * ==============================================================
 */
function calculatePayoutForNumber(num) {
  let payout = 0;
  if (bets[num.toString()]) payout += bets[num.toString()] * 36;
  if (num !== 0) {
    let isRed = RED_NUMS.includes(num); let isEven = num % 2 === 0;
    if (isRed && bets['RED']) payout += bets['RED'] * 2;
    if (!isRed && bets['BLACK']) payout += bets['BLACK'] * 2;
    if (isEven && bets['EVEN']) payout += bets['EVEN'] * 2;
    if (!isEven && bets['ODD']) payout += bets['ODD'] * 2;
  }
  return payout;
}

function determineWinningNumber() {
  if (Object.keys(bets).length === 0) return ROULETTE_SEQ[Math.floor(Math.random() * ROULETTE_SEQ.length)];
  let forceWin = (Math.random() < playerWinRate);
  let possibleOutcomes = [];

  for(let i=0; i<=36; i++) {
    possibleOutcomes.push({ num: i, net: calculatePayoutForNumber(i) - totalBet, payout: calculatePayoutForNumber(i) });
  }

  if (forceWin) {
    let winPool = possibleOutcomes.filter(o => o.net > 0);
    return winPool.length > 0 ? winPool[Math.floor(Math.random() * winPool.length)].num : ROULETTE_SEQ[Math.floor(Math.random() * ROULETTE_SEQ.length)];
  } else {
    let losePool = possibleOutcomes.filter(o => o.net <= 0);
    if (losePool.length > 0) {
      let strictZonk = losePool.filter(o => o.net < 0);
      if(strictZonk.length > 0 && Math.random() > 0.2) return strictZonk[Math.floor(Math.random() * strictZonk.length)].num;
      return losePool[Math.floor(Math.random() * losePool.length)].num;
    }
    possibleOutcomes.sort((a,b) => a.payout - b.payout); return possibleOutcomes[0].num; 
  }
}

/**
 * ==============================================================
 * 5. PREMIUM 3D SPIN ANIMATION & STATISTICS
 * ==============================================================
 */
const gameStats = { history: [], spin: 0 };

function updateStatistics(number) {
  gameStats.spin++;
  gameStats.history.unshift(number);
  if(gameStats.history.length > 15) gameStats.history.pop();
  
  const historyBar = document.getElementById("historyBar");
  historyBar.innerHTML = "";
  gameStats.history.forEach(num => {
    const div = document.createElement("div");
    div.className = "history-item";
    if(num === 0) div.classList.add("green");
    else if(RED_NUMS.includes(num)) div.classList.add("red");
    else div.classList.add("black");
    div.textContent = num;
    historyBar.appendChild(div);
  });
  
  document.getElementById("statSpin").textContent = gameStats.spin;
  
  // Calculate Hot/Cold
  const map = {};
  gameStats.history.forEach(n => map[n] = (map[n]||0)+1);
  let hot = "-", cold = "-", hotCount = 0, coldCount = 999;
  Object.keys(map).forEach(k => {
    if(map[k] > hotCount) { hot = k; hotCount = map[k]; }
    if(map[k] < coldCount) { cold = k; coldCount = map[k]; }
  });
  document.getElementById("hotNumber").textContent = hot;
  document.getElementById("coldNumber").textContent = cold;
}

function spinWheel() {
  if (isSpinning) return;
  if (totalBet === 0) {
    premiumToast("PLACE A BET FIRST!", "#e11d48");
    return setBanner("PLACE A BET FIRST!");
  }

  isSpinning = true;
  document.getElementById('btnSpin').disabled = true;
  document.getElementById('btnClear').disabled = true;
  setBanner("NO MORE BETS!");

  let targetNum = determineWinningNumber();
  let baseIndex = ROULETTE_SEQ.indexOf(targetNum);
  let targetIndex = (ROULETTE_SEQ.length * 3) + baseIndex; 
  
  let itemNode = document.querySelector('.wheel-number');
  let gap = parseInt(window.getComputedStyle(track).gap) || 6;
  let itemWidth = itemNode.offsetWidth + gap; 
  
  let centerOffset = document.querySelector('.wheel-container').offsetWidth / 2;
  let randomDrift = (Math.random() - 0.5) * 10;
  
  let finalTransform = (targetIndex * itemWidth) - centerOffset + (itemNode.offsetWidth / 2) + randomDrift; 

  // Reset Track (GPU Accelerated via translate3d)
  track.style.willChange = "transform";
  track.style.transition = 'none'; 
  track.style.transform = `translate3d(0,0,0)`;
  void track.offsetWidth; 

  // Animate
  track.style.transition = 'transform 4.8s cubic-bezier(.08,.86,.18,1)';
  track.style.transform = `translate3d(-${finalTransform}px,0,0)`;

  setTimeout(() => { 
    track.style.willChange = "auto";
    resolveSpin(targetNum); 
  }, 4900);
}

function resolveSpin(winNum) {
  updateStatistics(winNum);
  let winAmount = calculatePayoutForNumber(winNum);
  let numColor = winNum === 0 ? 'var(--success)' : (RED_NUMS.includes(winNum) ? 'var(--danger)' : '#cbd5e1');

  const modal = document.getElementById('resultModal');
  const resNum = document.getElementById('resNumber');
  const resText = document.getElementById('resText');
  const resLabel = document.getElementById('resLabel');

  resLabel.textContent = "WINNING NUMBER";
  resNum.textContent = winNum; 
  resNum.style.color = numColor;

  if (winAmount > 0) {
    currentUser.balance += winAmount; 
    document.getElementById('displayBalance').textContent = currentUser.balance.toLocaleString();
    resText.className = 'result-payout'; 
    resText.textContent = `+ ${winAmount.toLocaleString()}`;
    setBanner(`YOU WON ${winAmount.toLocaleString()}!`, true); 
    premiumToast(`YOU WIN ${formatChip(winAmount)}`, "var(--success)");
    
    // Scale confetti based on multiplier (Jackpot logic)
    if(winAmount >= totalBet * 30) {
        resLabel.textContent = "MEGA WIN"; confettiEngine.burst(300);
    } else if (winAmount >= totalBet * 15) {
        resLabel.textContent = "BIG WIN"; confettiEngine.burst(200);
    } else {
        confettiEngine.burst(120);
    }
  } else {
    resText.className = 'result-zonk'; resText.textContent = `HOUSE WINS`;
    setBanner("BETTER LUCK NEXT TIME");
    premiumToast("HOUSE WINS", "var(--danger)");
  }
  modal.classList.add('show');
}

function closeResult() {
  document.getElementById('resultModal').classList.remove('show');
  totalBet = 0; bets = {};
  document.getElementById('spinTotal').textContent = '';
  document.getElementById('btnSpin').disabled = false; 
  document.getElementById('btnClear').disabled = false;
  document.querySelectorAll('.chip-placed').forEach(el => { el.style.display = 'none'; el.classList.remove('chip-update'); });
  isSpinning = false; setBanner("PLACE YOUR BETS");
  
  if(typeof api !== 'undefined' && api.saveProgress) {
    api.saveProgress(currentUser.username, currentUser.balance, currentUser.level||1, currentUser.exp||0).catch(()=>{});
  }
}

/**
 * ==============================================================
 * 6. CONFETTI ENGINE (Dipertahankan)
 * ==============================================================
 */
const confettiEngine = {
  canvas: document.getElementById('confettiCanvas'), ctx: null, particles: [],
  colors: ['#d4af37', '#ffdf73', '#00e5ff', '#ff007f', '#ffffff'],
  init() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); this.run(); },
  resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  spawn(count) {
    for(let i=0; i<count; i++) {
      this.particles.push({
        x: this.canvas.width/2, y: this.canvas.height/2, vx: (Math.random()-0.5)*40, vy: (Math.random()-1)*40,
        size: Math.random()*12+6, color: this.colors[Math.floor(Math.random()*this.colors.length)],
        rot: Math.random()*360, rotSpd: (Math.random()-0.5)*25, life: 1
      });
    }
  },
  burst(count) { this.spawn(count); },
  run() {
    if(this.particles.length > 0) {
      this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height);
      this.particles.forEach((p, i) => {
        p.vy += 0.8; p.x += p.vx; p.y += p.vy; p.rot += p.rotSpd; p.life -= 0.015;
        this.ctx.save(); this.ctx.translate(p.x, p.y); this.ctx.rotate(p.rot*Math.PI/180);
        this.ctx.fillStyle = p.color; this.ctx.globalAlpha = Math.max(p.life, 0);
        this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); this.ctx.restore();
        if(p.y > this.canvas.height || p.life <= 0) this.particles.splice(i, 1);
      });
    } else { this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height); }
    requestAnimationFrame(() => this.run());
  }
};
confettiEngine.init();

// Anti double-click
document.addEventListener("dblclick", e => e.preventDefault());

</script>
