<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Casino - Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #06090e;
    --bg-panel: #11151e;
    --gold-main: #d4af37;
    --gold-dark: #8a6d1c;
    --text-light: #e2e8f0;
    --text-muted: #64748b;
    --danger: #ef4444;
    --success: #22c55e;
    --font-ui: 'Montserrat', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #06090e;
    color: var(--text-light);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .admin-header {
    background: var(--bg-panel);
    border-bottom: 2px solid var(--gold-dark);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .admin-title {
    font-family: 'Cinzel', serif;
    color: var(--gold-main);
    font-size: 24px;
  }

  .btn-back {
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    font-size: 12px;
  }

  .container {
    padding: 30px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .section-title {
    color: var(--gold-main);
    margin-bottom: 15px;
    font-family: 'Cinzel', serif;
    border-bottom: 1px solid var(--gold-dark);
    padding-bottom: 10px;
    margin-top: 40px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    align-items: center;
  }

  .btn-refresh {
    background: var(--gold-main);
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  
  .btn-refresh:hover { background: #facc15; }

  .table-container {
    background: var(--bg-panel);
    border: 1px solid #334155;
    border-radius: 12px;
    overflow-x: auto;
    margin-bottom: 30px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th, td {
    padding: 15px;
    border-bottom: 1px solid #1e293b;
  }

  th {
    background: #0f172a;
    color: var(--gold-main);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  td { font-size: 14px; }

  .balance-col {
    font-family: 'Orbitron', sans-serif;
    color: var(--success);
    font-weight: bold;
  }

  .btn-edit { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
  .btn-approve { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 5px;}
  .btn-reject { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

  .badge-pending { background: #eab308; color: #000; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;}
  .badge-approved { background: var(--success); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;}
  .badge-rejected { background: var(--danger); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;}

  .loading {
    text-align: center;
    padding: 50px;
    color: var(--gold-main);
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-title">👑 ROYAL CASINO - ADMIN PANEL</div>
    <a href="index.html" class="btn-back">KEMBALI KE LOBBY</a>
  </header>

  <div class="container">
    <div class="controls">
      <h2>Dashboard Panel</h2>
      <button class="btn-refresh" onclick="loadData()" id="btnRefresh">🔄 Refresh Data</button>
    </div>

    <!-- TABEL 1: PERMINTAAN DEPOSIT -->
    <h3 class="section-title">Permintaan Deposit (QRIS)</h3>
    <div class="table-container">
      <table id="depositTable">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Username</th>
            <th>Metode</th>
            <th>Nominal</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="depositTableBody">
          <tr><td colspan="6" class="loading">Memuat data dari server...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- TABEL 2: DATA PEMAIN -->
    <h3 class="section-title">Data Pemain Terdaftar</h3>
    <div class="table-container">
      <table id="usersTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Nama Lengkap</th>
            <th>Kontak (HP/Email)</th>
            <th>Rekening</th>
            <th>Level</th>
            <th>Saldo (Credits)</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" class="loading">Memuat data dari server...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // 1. CEK OTORISASI
    const userJson = localStorage.getItem('currentUser');
    if (!userJson) {
      window.location.href = 'auth.html';
    } else {
      const user = JSON.parse(userJson);
      if (user.username !== 'admin_casino') {
        alert('Akses Ditolak! Anda bukan admin.');
        window.location.href = 'index.html';
      }
    }

    let globalDatabase = null;

    // 2. FUNGSI MEMUAT SEMUA DATA (USER & DEPOSIT)
    async function loadData() {
      const tbodyUsers = document.getElementById('tableBody');
      const tbodyDeposits = document.getElementById('depositTableBody');
      const btnRefresh = document.getElementById('btnRefresh');
      
      btnRefresh.textContent = "Memuat...";
      btnRefresh.disabled = true;
      tbodyUsers.innerHTML = '<tr><td colspan="7" class="loading">Memuat data...</td></tr>';
      tbodyDeposits.innerHTML = '<tr><td colspan="6" class="loading">Memuat data...</td></tr>';

      const db = await api.getDatabase();
      
      if (db) {
        globalDatabase = db;
        
        // --- RENDER TABEL USER ---
        if (db.users) {
          tbodyUsers.innerHTML = '';
          db.users.forEach((u, index) => {
            if (u.username === 'admin') return;
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${u.username}</strong></td>
              <td>${u.fullName || '-'}</td>
              <td>${u.phone || '-'}<br><span style="font-size:10px; color:gray;">${u.email || '-'}</span></td>
              <td>${u.bank || '-'}</td>
              <td>Lvl ${u.level || 1}</td>
              <td class="balance-col">${(u.balance || 0).toLocaleString()}</td>
              <td>
                <button class="btn-edit" onclick="editBalance(${index}, '${u.username}')">Ubah Saldo</button>
              </td>
            `;
            tbodyUsers.appendChild(tr);
          });
          if (tbodyUsers.innerHTML === '') tbodyUsers.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px;">Belum ada pemain.</td></tr>';
        }

        // --- RENDER TABEL DEPOSIT ---
        if (db.deposits) {
          tbodyDeposits.innerHTML = '';
          // Render dari yang terbaru (reverse)
          [...db.deposits].reverse().forEach((dep, reverseIndex) => {
            const originalIndex = db.deposits.length - 1 - reverseIndex;
            let statusBadge = '';
            let actionButtons = '-';

            if (dep.status === 'pending') {
              statusBadge = '<span class="badge-pending">PENDING</span>';
              actionButtons = `
                <button class="btn-approve" onclick="processDeposit(${originalIndex}, 'approved')">Terima</button>
                <button class="btn-reject" onclick="processDeposit(${originalIndex}, 'rejected')">Tolak</button>
              `;
            } else if (dep.status === 'approved') {
              statusBadge = '<span class="badge-approved">BERHASIL</span>';
            } else {
              statusBadge = '<span class="badge-rejected">DITOLAK</span>';
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${dep.date || '-'}</td>
              <td><strong>${dep.username}</strong></td>
              <td>${dep.method || 'QRIS'}</td>
              <td class="balance-col">${parseInt(dep.amount).toLocaleString()}</td>
              <td>${statusBadge}</td>
              <td>${actionButtons}</td>
            `;
            tbodyDeposits.appendChild(tr);
          });
          if (tbodyDeposits.innerHTML === '') tbodyDeposits.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">Belum ada riwayat deposit.</td></tr>';
        } else {
          // Jika array deposits belum ada di database, siapkan array kosong
          globalDatabase.deposits = [];
          tbodyDeposits.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">Belum ada riwayat deposit.</td></tr>';
        }
      } else {
        tbodyUsers.innerHTML = '<tr><td colspan="7" style="text-align:center; color: red;">Gagal memuat data dari server.</td></tr>';
        tbodyDeposits.innerHTML = '<tr><td colspan="6" style="text-align:center; color: red;">Gagal memuat data dari server.</td></tr>';
      }

      btnRefresh.textContent = "🔄 Refresh Data";
      btnRefresh.disabled = false;
    }

    // 3. FUNGSI PROSES DEPOSIT (APPROVE/REJECT)
    async function processDeposit(depIndex, action) {
      if (!globalDatabase) return;
      const deposit = globalDatabase.deposits[depIndex];
      
      const confirmMsg = action === 'approved' 
        ? `Setujui deposit ${deposit.amount.toLocaleString()} untuk pemain ${deposit.username}? Saldo akan bertambah otomatis.` 
        : `Tolak permintaan deposit dari ${deposit.username}?`;

      if (confirm(confirmMsg)) {
        deposit.status = action;

        // Jika disetujui, tambahkan saldo ke user terkait
        if (action === 'approved') {
          const userIndex = globalDatabase.users.findIndex(u => u.username === deposit.username);
          if (userIndex !== -1) {
            let currentBalance = parseInt(globalDatabase.users[userIndex].balance) || 0;
            globalDatabase.users[userIndex].balance = currentBalance + parseInt(deposit.amount);
          } else {
            alert('Error: Username tidak ditemukan di database pemain!');
            return;
          }
        }

        document.getElementById('btnRefresh').textContent = "Menyimpan...";
        const result = await api.updateDatabase(globalDatabase);
        
        if (result) {
          alert(`Deposit berhasil di-${action === 'approved' ? 'Setujui' : 'Tolak'}!`);
          loadData(); // Render ulang
        } else {
          alert('Gagal menyimpan ke server!');
        }
      }
    }

    // 4. FUNGSI MENGUBAH SALDO MANUAL (TETAP ADA SEBAGAI BACKUP)
    async function editBalance(userIndex, username) {
      if (!globalDatabase) return;
      const currentBalance = globalDatabase.users[userIndex].balance || 0;
      const newBalanceStr = prompt(`Masukkan saldo baru untuk pemain ${username}:`, currentBalance);
      
      if (newBalanceStr !== null && newBalanceStr !== "") {
        const newBalance = parseInt(newBalanceStr);
        if (isNaN(newBalance)) return alert('Error: Masukkan angka yang valid!');

        if (confirm(`Yakin mengubah saldo ${username} dari ${currentBalance} menjadi ${newBalance}?`)) {
          globalDatabase.users[userIndex].balance = newBalance;
          document.getElementById('btnRefresh').textContent = "Menyimpan...";
          const result = await api.updateDatabase(globalDatabase);
          if (result) {
            alert('Saldo berhasil diubah!');
            loadData();
          } else {
            alert('Gagal menyimpan ke server!');
          }
        }
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
